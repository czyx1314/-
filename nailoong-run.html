        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 100,
        grav: 640, life: rand(0.5, 1), size: rand(3, 6),
        color: ['#B46BE0', '#FF9F43', '#FFE066', '#FFF3B0'][randInt(0, 3)]
      });
    }
    floatTexts.push({ x: W / 2, y: 138, life: 2, big: true, text: '击败胡萝卜术！', color: '#FFE066', stroke: '#B4500A' });
    floatTexts.push({ x: W / 2, y: 170, life: 2, text: '主界面已解锁换装', color: '#FFFFFF', stroke: '#4A6A00' });
    refreshSkinButton();
    nextObstacleAt = traveled + speed * 0.9; // 击败后稍作喘息再继续出障碍
  }

  // 主界面换装按钮：未解锁时显示锁定提示，解锁后在已解锁形象之间循环切换
  function refreshSkinButton() {
    if (!bossDefeated) {
      btnSkin.classList.add('locked');
      btnSkin.textContent = '🔒 胡萝卜术（1000分Boss解锁）';
      return;
    }
    var list = unlockedSkins();
    var cur = skinInfo(skin);
    if (list.indexOf(cur) < 0) { // 当前皮肤尚未解锁 → 回退到第一个
      cur = list[0];
      skin = cur.id;
      store.set('nailoong_skin', skin);
    }
    btnSkin.classList.remove('locked');
    var txt = cur.icon + ' 换装：' + cur.name;
    if (list.length > 1) {
      var next = list[(list.indexOf(cur) + 1) % list.length];
      txt += '　→　' + next.icon + next.name;
    }
    btnSkin.textContent = txt;
  }
  function onSkinButton() {
    if (!bossDefeated) {
      btnSkin.textContent = '🔒 达到1000分并击败Boss后解锁';
      setTimeout(refreshSkinButton, 1300);
      return;
    }
    var list = unlockedSkins();
    var i = list.indexOf(skinInfo(skin));
    i = (i + 1) % list.length;
    skin = list[i].id;
    store.set('nailoong_skin', skin);
    refreshSkinButton();
    SFX.coin();
  }

  // 竖屏提示的“进入横屏”：优先请求真机横屏，随后自动全屏；不支持时保持强制旋转
  function onRotateOk() {
    try {
      var lock = screen.orientation && screen.orientation.lock;
      if (lock) { var p = lock.call(screen.orientation, 'landscape'); if (p && p.catch) p.catch(function () {}); }
    } catch (e) {}
    enterFullscreen();
    // 请求发出后浏览器可能不会立刻回调 orientationchange，手动刷新一次状态
    setTimeout(applyOrientation, 260);
    show(rotateOverlay, false);
  }

  function resetGame() {
    player.x = 300; player.y = GROUND_Y; player.vy = 0;
    player.onGround = true; player.ducking = false;
    player.dead = false; player.deadT = 0;
    player.runPhase = 0; player.blinkT = 2.5;
    obstacles.length = 0;
    coins.length = 0;
    particles.length = 0;
    speed = BASE_SPEED;
    traveled = 0; score = 0; coinCount = 0;
    nextObstacleAt = 460; nextCoinAt = 900;
    shake = 0; newRecord = false;
    boss.active = false; boss.done = false; boss.dying = 0;
    boss.hp = BOSS_HP; boss.t = 0; boss.hitFlash = 0;
    boss.php = BOSS_PHASES[0].hp;
    boss.phase = 0; boss.skill = ''; boss.say = ''; boss.sayT = 0; boss.sayMax = 2.1;
    bossSpirit.on = 0; bossSpirit.t = 0;
    boss.state = 'idle'; boss.stateT = 0; boss.stateDur = 1;
    boss.targetX = W - 170; boss.baseY = 238;
    boss.tilt = 0; boss.ease = 2.4; boss.dashFired = false; boss.flash = 0;
    boss.armF = 0.3; boss.armB = 0.12; boss.pending.length = 0; boss.ponder = 0;
    bossShots.length = 0;
  }

  function startGame() {
    SFX.ensure();
    resetGame();
    state = 'playing';
    show(rotateOverlay, false);
    show(hud, true); show(scMenu, false); show(scOver, false); show(scPause, false);
    hudScore.textContent = '0'; hudCoins.textContent = '0';
    applyOrientation(); // 开局前确保处于横屏布局
    SFX.start();
  }

  function showMenu() {
    state = 'menu';
    resetGame();
    show(hud, false); show(scMenu, true); show(scOver, false); show(scPause, false);
    applyOrientation(); // 回到主界面时按当前方向刷新横屏状态
    refreshBestUI();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      show(scPause, true);
      btnPause.textContent = '▶';
    } else if (state === 'paused') {
      state = 'playing';
      show(scPause, false);
      btnPause.textContent = '⏸';
    }
  }

  function gameOver() {
    state = 'over';
    var dist = Math.floor(traveled / 30);
    el('over-score').textContent = fmt(score);
    el('over-coins').textContent = fmt(coinCount);
    el('over-dist').textContent = fmt(dist);
    if (score > bestScore) {
      bestScore = score;
      store.set('nailoong_best', String(bestScore));
      newRecord = true;
    }
    refreshBestUI();
    show(el('record-badge'), newRecord);
    el('over-title').textContent = newRecord ? '新纪录！' : '游戏结束';
    if (newRecord) SFX.record();
    show(scOver, true);
    btnPause.textContent = '⏸';
  }

  function die() {
    if (player.dead) return;
    player.dead = true;
    player.deadT = 0;
    player.vy = 0;
    shake = 16;
    SFX.hit();
    setTimeout(function () { SFX.over(); }, 350);
    // 爆炸粒子
    for (var i = 0; i < 16; i++) {
      var a = rand(0, Math.PI * 2), v = rand(60, 300);
      spawnParticle(player.x + 4, player.y - 40, {
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120,
        grav: 900, life: rand(0.5, 0.9), size: rand(3, 7),
        color: ['#FFD93D', '#FF9F43', '#FFF3C4', '#E8A100'][randInt(0, 3)]
      });
    }
  }

  /* ================= 操作 ================= */
  function doJump() {
    if (state === 'menu') { startGame(); return; }
    if (state === 'over') { startGame(); return; }
    if (state !== 'playing' || player.dead) return;
    if (player.onGround) {
      player.vy = JUMP_V;
      player.onGround = false;
      player.ducking = false;
      SFX.jump();
      for (var i = 0; i < 5; i++) {
        spawnParticle(player.x + rand(-12, 12), GROUND_Y - 2, {
          vx: rand(-90, -20), vy: rand(-70, -10), grav: 500,
          life: rand(0.25, 0.45), size: rand(2, 4.5), color: '#E3C289'
        });
      }
    }
  }

  var duckHeld = false;
  function startDuck() {
    if (state !== 'playing' || player.dead) return;
    if (player.onGround) player.ducking = true;
    duckHeld = true;
  }
  function endDuck() {
    duckHeld = false;
    if (player.onGround) player.ducking = false;
  }

  /* ================= 更新 ================= */
  function update(dt, now) {
    // 云 & 背景（任何状态都飘）
    clouds.forEach(function (c) {
      c.x -= c.v * dt * (state === 'playing' ? 1 : 0.4);
      if (c.x < -70) { c.x = W + 60; c.y = rand(30, 150); c.s = rand(0.6, 1.3); }
    });

    if (state === 'menu') {
      groundOffset += 140 * dt;
      player.runPhase += dt * 3.4;
      player.blinkT -= dt;
      if (player.blinkT < -0.14) player.blinkT = rand(2, 5);
      updateParticles(dt);
      return;
    }

    if (state === 'paused' || state === 'over') {
      updateParticles(dt);
      return;
    }

    /* ---- playing ---- */
    if (player.dead) {
      player.deadT += dt;
      shake = Math.max(0, shake - dt * 30);
      updateParticles(dt);
      if (player.deadT > 1.15) gameOver();
      return;
    }

    // 速度与距离
    speed = Math.min(MAX_SPEED, speed + SPEED_ACC * dt);
    traveled += speed * dt;
    groundOffset += speed * dt;
    score = Math.floor(traveled / 20) + coinCount * 10;
    hudScore.textContent = fmt(score);

    // 玩家物理
    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;
    if (player.y >= GROUND_Y) {
      if (!player.onGround) { SFX.land(); player.ducking = duckHeld; }
      player.y = GROUND_Y;
      player.vy = 0;
      player.onGround = true;
    } else {
      player.onGround = false;
      player.ducking = false;
    }
    if (player.onGround) player.runPhase += dt * (speed / 42);

    // 眨眼
    player.blinkT -= dt;
    if (player.blinkT < -0.14) player.blinkT = rand(2, 5);

    // 跑步灰尘
    if (player.onGround && Math.random() < dt * 22) {
      spawnParticle(player.x - 14, GROUND_Y - 2, {
        vx: -speed * 0.35 + rand(-20, 20), vy: rand(-50, -5), grav: 420,
        life: rand(0.25, 0.5), size: rand(2, 4), color: '#D9B77C'
      });
    }
    // 速度线
    if (speed > 500 && Math.random() < dt * 26) {
      spawnParticle(rand(W * 0.3, W), rand(40, GROUND_Y - 60), {
        vx: -950, life: rand(0.18, 0.32), size: rand(20, 46),
        color: 'rgba(255,255,255,0.55)', shape: 'line'
      });
    }

    // Boss 现身（达到分数后触发一次，本局击败后不再出现）
    if (!boss.active && !boss.done && score >= BOSS_SCORE) startBoss();

    // 生成障碍（Boss 战期间也刷，但只出地面障碍且间隔拉长：收金币仍需走位跳躲，保留压力）
    // Boss 出招中（wind/fire/dash）暂停刷障碍，避免障碍叠在弹道上出现"躲弹必撞"的死角
    var canSpawnObstacle = !boss.active || boss.state === 'idle' || boss.state === 'recover' || boss.state === 'hurt';
    if (canSpawnObstacle && traveled >= nextObstacleAt) {
      // 若金币组刚刷在生成点附近，推迟障碍，避免障碍直接压在金币上
      if (coinNearX(W + 46, COIN_SAFE_GAP + 30)) {
        nextObstacleAt = traveled + speed * 0.35;
      } else {
        var hard = clamp(traveled / 12000, 0, 1);
        var type = boss.active ? pickGroundObstacle() : pickObstacle(hard);
        spawnObstacle(type);
        var gapF = 1.45 - 0.45 * hard;
        if (boss.active) gapF *= 1.75; // Boss 战间隔额外拉长，给躲弹幕留余量
        nextObstacleAt = traveled + speed * rand(0.9, 1.4) * gapF + (type === 'bird_high' ? speed * 0.45 : 0);
      }
    }

    // 生成金币（Boss 战略密于平时，但不再刷屏：数量靠"够得着"而非"铺满地"）
    if (traveled >= nextCoinAt) {
      spawnCoinGroup();
      nextCoinAt = traveled + speed * (boss.active ? rand(1.9, 3.1) : rand(2.4, 4.2));
    }

    // 障碍移动
    for (var i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].x -= speed * dt;
      if (obstacles[i].x + obstacles[i].w < -20) obstacles.splice(i, 1);
    }
    // 金币移动 & 拾取
    var pb = playerBox();
    for (var j = coins.length - 1; j >= 0; j--) {
      var c = coins[j];
      c.x -= speed * dt;
      c.t += dt;
      if (c.x < -30) { coins.splice(j, 1); continue; }
      // 圆形碰撞
      var pcx = player.x, pcy = player.y - (player.ducking ? 20 : 36);
      var dx = c.x - pcx, dy = c.y - pcy;
      if (dx * dx + dy * dy < 34 * 34) {
        coins.splice(j, 1);
        coinCount++;
        SFX.coin();
        floatTexts.push({ x: c.x, y: c.y, life: 0.7 });
        for (var k = 0; k < 8; k++) {
          var a = rand(0, Math.PI * 2), v = rand(40, 170);
          spawnParticle(c.x, c.y, {
            vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
            grav: 500, life: rand(0.3, 0.55), size: rand(2, 4),
            color: ['#FFD93D', '#FFF3B0', '#F6B93B'][randInt(0, 2)]
          });
        }
        // Boss 战：每枚金币对 Boss 造成 1 点伤害
        if (boss.active) {
          bossTakeHit();
          SFX.bossHit();
          floatTexts.push({ x: boss.x, y: boss.y - 150, life: 0.7, text: '-1', color: '#FF6B5D', stroke: '#7A1E14' });
          for (var bp = 0; bp < 6; bp++) {
            var ba = rand(0, Math.PI * 2), bv = rand(60, 190);
            spawnParticle(boss.x, boss.y - 80, {
              vx: Math.cos(ba) * bv, vy: Math.sin(ba) * bv - 40,
              grav: 500, life: rand(0.25, 0.5), size: rand(2, 4),
              color: ['#B46BE0', '#FF9F43', '#FFE066'][randInt(0, 2)]
            });
          }
          if (boss.hp <= 0) defeatBoss();
        }
      }
    }
    hudCoins.textContent = fmt(coinCount);

    // Boss 动作组：入场 / 巡游 / 聚气 / 释放 / 喘息 / 俯冲横扫 / 受击后仰
    if (boss.active) updateBoss(dt);
    // 弹幕移动与清理
    for (var bs = bossShots.length - 1; bs >= 0; bs--) {
      var shot = bossShots[bs];
      shot.x += shot.vx * dt;
      shot.t += dt;
      if (shot.x < -60) { bossShots.splice(bs, 1); continue; }
      // 碰撞：低位需跳过，高位需下蹲躲过；横扫判定更宽更长
      if (!player.dead) {
        var sb = shotBox(shot.kind), shw = sb.w, shh = sb.h;
        var sTop = shot.cy - shh / 2, sBot = shot.cy + shh / 2;
        // 高位弹带"追魂"判定：玩家一旦腾空，弹幕会向上追击（判定上沿抬到玩家脚下），
        // 所以跳跃完全躲不掉高位弹——正解是原地下蹲，站着不动则会被命中
        if (shot.high && !player.onGround) sTop = Math.min(sTop, player.y - 8);
        if (overlap(pb.x, pb.y, pb.w, pb.h, shot.x - shw / 2, sTop, shw, sBot - sTop)) {
          die();
        }
      }
      // 兜底：飞行中的弹幕撞上障碍同样将其碾碎（补发射时走廊清理的漏网）
      var qsb = shotBox(shot.kind);
      for (var oi = obstacles.length - 1; oi >= 0; oi--) {
        var qo = obstacles[oi];
        if (qo.type === 'bird_low' || qo.type === 'bird_high') continue;
        if (qo.x + qo.w / 2 > shot.x - qsb.w / 2 && qo.x - qo.w / 2 < shot.x + qsb.w / 2
          && GROUND_Y - qo.h < shot.cy + qsb.h / 2 && GROUND_Y > shot.cy - qsb.h / 2) {
          crushObstacle(oi);
        }
      }
    }
    if (boss.dying > 0) {
      boss.dying += dt;
      boss.x += 300 * dt;
      boss.y -= 230 * dt;
      bossSpirit.on = Math.max(0, bossSpirit.on - dt * 2); // 真身随败退一起消散
      if (boss.dying >= 1) boss.dying = 0;
    }

    // 碰撞检测
    if (!player.dead) {
      for (var m = 0; m < obstacles.length; m++) {
        var o = obstacles[m];
        var ox = o.x - o.w / 2 + 2, ow = o.w - 4;
        var oy, oh;
        if (o.type === 'bird_low' || o.type === 'bird_high') {
          oy = o.cy - o.h / 2 + 2; oh = o.h - 4;
        } else {
          oy = GROUND_Y - o.h + 2; oh = o.h - 2;
        }
        if (overlap(pb.x, pb.y, pb.w, pb.h, ox, oy, ow, oh)) {
          die();
          break;
        }
      }
    }

    updateParticles(dt);
    shake = Math.max(0, shake - dt * 30);

    // 飘字
    for (var f = floatTexts.length - 1; f >= 0; f--) {
      var ft = floatTexts[f];
      ft.life -= dt;
      ft.y -= 46 * dt;
      if (ft.life <= 0) floatTexts.splice(f, 1);
    }
  }

  function playerBox() {
    var h = player.ducking ? 42 : 70;
    var w = player.ducking ? 54 : 42;
    return { x: player.x - w / 2, y: player.y - h, w: w, h: h };
  }

  /* ================= 渲染 ================= */
  function render(now) {
    ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0.5) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

    drawSky();
    clouds.forEach(drawCloud);
    drawHills(groundOffset * 0.25, '#CDEAC0', GROUND_Y - 8, 52, 260);
    drawHills(groundOffset * 0.5, '#A8D5A2', GROUND_Y + 2, 34, 170);
    drawGround();

    coins.forEach(function (c) { drawCoin(c, now); });
    obstacles.forEach(function (o) {
      if (o.type === 'cactus_s' || o.type === 'cactus_l') drawCactus(o.x, GROUND_Y + 2, o.w, o.h);
      else if (o.type === 'rock') drawRock(o.x, GROUND_Y + 2, o.w, o.h);
      else drawBird(o.x, o.cy, now);
    });

    if (boss.active || boss.dying > 0) drawBoss(now);
    for (var bsi = 0; bsi < bossShots.length; bsi++) drawCarrotShot(bossShots[bsi], now);

    drawPlayerChar(now);
    drawParticles();

    // 金币飘字
    floatTexts.forEach(function (ft) {
      ctx.save();
      ctx.globalAlpha = clamp(ft.life / 0.7, 0, 1);
      ctx.font = '900 ' + (ft.big ? 30 : 20) + 'px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3.5; ctx.strokeStyle = ft.stroke || '#E8A100';
      ctx.strokeText(ft.text || '+10', ft.x, ft.y);
      ctx.fillStyle = ft.color || '#FFF3B0';
      ctx.fillText(ft.text || '+10', ft.x, ft.y);
      ctx.restore();
    });

    ctx.restore();

    // Boss 血条（屏幕固定位置，不随震屏抖动）
    if (boss.active) drawBossBar();

    // 死亡红闪
    if (player.dead && player.deadT < 0.22 && state !== 'menu') {
      ctx.fillStyle = 'rgba(255, 60, 60, ' + (0.28 * (1 - player.deadT / 0.22)) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ================= 自适应布局 ================= */
  // 画面按容器宽度缩放时，UI 用 em 等比跟随；画布分辨率按 DPR 提升，避免放大后模糊
  var wrap = document.getElementById('game-wrap');
  var renderScale = 1;
  function fitLayout() {
    var cssW = canvas.clientWidth || W;
    var s = cssW / W;
    // 触摸设备再放大一档，避免手机上按钮和数值偏小；上限保持 20px，桌面观感不变
    var boost = isTouch ? 1.25 : 1;
    wrap.style.fontSize = clamp(16 * s * boost, 13, 20) + 'px'; // UI 基准字号
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderScale = Math.max(1, s * dpr);
    var bw = Math.round(W * renderScale), bh = Math.round(H * renderScale);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw; canvas.height = bh;
    }
  }
  window.addEventListener('resize', fitLayout);
  window.addEventListener('orientationchange', fitLayout);
  // 手机横竖屏状态变化时切换“默认横屏/强制旋转铺满”
  window.addEventListener('resize', applyOrientation);
  window.addEventListener('orientationchange', function () { setTimeout(applyOrientation, 120); });
  if (window.matchMedia) {
    var mqOrient = window.matchMedia('(orientation: portrait)');
    if (mqOrient.addEventListener) mqOrient.addEventListener('change', applyOrientation);
    else if (mqOrient.addListener) mqOrient.addListener(applyOrientation);
  }
  document.addEventListener('fullscreenchange', function () {
    isFullscreen = !!fsElement();
    var b = el('btn-fullscreen'); if (b) b.textContent = isFullscreen ? '⤡' : '⛶';
    fitLayout();
  });
  document.addEventListener('webkitfullscreenchange', fitLayout);
  // 初始按当前方向布局（手机竖屏进入即自动旋转横屏）
  applyOrientation();

  /* ================= 主循环 ================= */
  var lastT = performance.now();
  var frameCount = 0;
  var lastState = '';
  function frame(nowMs) {
    frameCount++;
    if (state !== lastState) { // 同步状态类（控制触摸按键显隐）
      lastState = state;
      document.body.classList.toggle('in-game', state === 'playing');
    }
    var dt = Math.min((nowMs - lastT) / 1000, 0.033);
    lastT = nowMs;
    update(dt, nowMs / 1000);
    render(nowMs / 1000);
    requestAnimationFrame(frame);
  }
  fitLayout();
  requestAnimationFrame(frame);
  // 看门狗：某些环境(如被节流的 iframe 预览)下 rAF 可能不触发，
  // 若 1.5 秒内一帧都没跑，自动切换为定时器驱动，保证画面不会静止
  setTimeout(function () {
    if (frameCount < 3) {
      var t0 = performance.now();
      setInterval(function () { frame(performance.now()); }, 16);
    }
  }, 1500);

  /* ================= 输入绑定 ================= */
  // 键盘
  window.addEventListener('keydown', function (e) {
    var code = e.code;
    if (code === 'Space' || code === 'ArrowUp' || code === 'ArrowDown' || code === 'ArrowLeft' || code === 'ArrowRight') {
      e.preventDefault();
    }
    if (e.repeat) return;
    if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') {
      if (state === 'playing' || state === 'menu' || state === 'over') doJump();
      else if (state === 'paused') togglePause();
    } else if (code === 'ArrowDown' || code === 'KeyS') {
      if (state === 'playing') startDuck();
    } else if (code === 'KeyP' || code === 'Escape') {
      if (state === 'playing' || state === 'paused') togglePause();
    } else if (code === 'Enter') {
      if (state === 'menu' || state === 'over') startGame();
    } else if (code === 'KeyM') {
      toggleMute();
    }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'ArrowDown' || e.code === 'KeyS') endDuck();
  });

  // 动作类入口：已在游戏中则忽略，避免 pointerdown/click 重复触发导致刚开局就重置
  function tryStart() {
    if (state === 'playing') return;
    startGame();
  }

  /* ---- 统一指针输入：按坐标命中，不依赖元素自身能否接收事件 ----
     移动端部分浏览器中，处在 pointer-events:none 容器内的按钮收不到触摸事件，
     因此在 document 捕获阶段统一处理，保证手机上也能稳定点中。 */
  var hotSpots = [];
  function bindHot(node, action) { hotSpots.push({ node: node, action: action }); }

  function hitHot(x, y) {
    for (var i = 0; i < hotSpots.length; i++) {
      var r = hotSpots[i].node.getBoundingClientRect();
      if (r.width <= 0 || r.height <= 0) continue; // 隐藏元素 rect 为 0，自动跳过
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return hotSpots[i];
    }
    return null;
  }

  /* PC 端键盘焦点修复：pointerdown 里调用 preventDefault 会同时抑制 mousedown
     的默认行为，导致页面（尤其是 iframe 嵌套时）点击后拿不到键盘焦点，
     空格/方向键等键盘操作全部失效。让游戏容器可聚焦，并在每次有效按压时
     显式聚焦，即可恢复键盘控制；移动端触摸不受影响。 */
  function focusGame() {
    try { wrap.focus({ preventScroll: true }); } catch (e) {
      try { wrap.focus(); } catch (e2) {}
    }
  }

  function onPointerDown(e) {
    var x = e.clientX, y = e.clientY;
    if (x === undefined || y === undefined) return;
    var h = hitHot(x, y);
    if (h) { if (e.preventDefault) e.preventDefault(); focusGame(); h.action(); return; }
    // 竖屏提示显示时，点击不穿透到游戏画面（避免误开局）。
    // 必须按“实际是否可见”判断：提示是靠媒体查询隐藏的，横屏时元素上并没有 hidden 类，
    // 只看类名会误判为“提示显示中”，从而把横屏下的鼠标/触摸操作全部拦掉。
    if (rotateOverlay && !rotateOverlay.classList.contains('hidden') &&
        window.getComputedStyle(rotateOverlay).display !== 'none') return;
    // 未命中按钮：按画面区域处理
    var r = canvas.getBoundingClientRect();
    if (x < r.left || x > r.right || y < r.top || y > r.bottom) return;
    if (e.preventDefault) e.preventDefault();
    focusGame();
    if (state === 'menu') { tryStart(); return; }       // 菜单：点画面即开始
    if (state === 'paused') { togglePause(); return; }  // 暂停：点画面继续
    if (state !== 'playing') return;
    if ((x - r.left) / r.width > 0.5) doJump(); else startDuck(); // 游戏中：右跳左蹲
  }

  if (window.PointerEvent) {
    document.addEventListener('pointerdown', onPointerDown, true);
  } else {
    document.addEventListener('mousedown', onPointerDown, true);
    document.addEventListener('touchstart', function (e) {
      var t = e.changedTouches && e.changedTouches[0];
      if (t) onPointerDown({ clientX: t.clientX, clientY: t.clientY, preventDefault: function () { e.preventDefault(); } });
    }, true);
  }
  window.addEventListener('pointerup', function () { if (duckHeld) endDuck(); });
  window.addEventListener('pointercancel', function () { if (duckHeld) endDuck(); });
  window.addEventListener('touchend', function () { if (duckHeld) endDuck(); });
  window.addEventListener('touchcancel', function () { if (duckHeld) endDuck(); });

  // 触摸设备标记：仅触摸设备显示跳/蹲虚拟键
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.body.classList.add('touch');
  }

  // 注册可点击区域（按注册顺序命中）
  bindHot(el('btn-jump'), doJump);
  bindHot(el('btn-duck'), startDuck);
  bindHot(el('btn-start'), tryStart);
  bindHot(el('btn-again'), tryStart);
  bindHot(el('btn-home'), showMenu);
  bindHot(el('btn-resume'), function () { if (state === 'paused') togglePause(); });
  bindHot(el('btn-quit'), showMenu);
  bindHot(btnPause, togglePause);
  bindHot(btnMute, toggleMute);
  bindHot(btnSkin, onSkinButton);
  bindHot(el('btn-rotate-ok'), onRotateOk);
  bindHot(el('btn-fullscreen'), toggleFullscreen);

  function toggleMute() {
    muted = !muted;
    store.set('nailoong_mute', muted ? '1' : '0');
    btnMute.textContent = muted ? '🔇' : '🔊';
    if (!muted) { SFX.ensure(); SFX.coin(); }
  }

  // 失焦自动暂停
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === 'playing') togglePause();
  });
  window.addEventListener('blur', function () {
    if (state === 'playing') togglePause();
  });
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
