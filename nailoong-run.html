<style data-page-node-id="J72gOqzYkFiYo6mknIMYm3" data-pnid-children="7gK22CINLOalLWEZ0renAR">
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, #BFE8FF 0%, #E8F7FF 55%, #FFF6D9 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Yuanti SC", sans-serif;
    overflow: hidden;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  /* 宽度同时受视口高度约束，保证画面尽量大又不超出屏幕；
     宽高都取 100vw/100dvh 是为了让画面本体在手机上铺满、配合竖屏旋转铺满全屏 */
  #game-wrap {
    position: relative;
    width: min(100vw, 1300px, calc(100vh * 2.4));
    font-size: 16px; /* 由 JS 按画面缩放比动态设置为 UI 基准字号 */
  }
  /* 支持 dvh 的手机浏览器改用可视高度计算，避免地址栏占位把画面压小 */
  @supports (height: 100dvh) {
    #game-wrap { width: min(100vw, 1300px, calc(100dvh * 2.4)); }
  }
  /* 可聚焦以获得键盘事件，但不显示焦点框 */
  #game-wrap:focus { outline: none; }
  canvas#game {
    width: 100%; height: auto; display: block;
    border-radius: 18px;
    box-shadow: 0 14px 44px rgba(31, 90, 140, .28);
    background: #8ED8F8;
  }
  /* 手机横屏时：画布铺满整个屏幕，去掉圆角与投影 */
  body.phone-landscape #game-wrap {
    width: 100vw; height: 100vh; height: 100dvh;
    display: flex; align-items: center; justify-content: center;
  }
  body.phone-landscape canvas#game {
    border-radius: 0; box-shadow: none;
    width: 100%; height: auto; max-height: 100%;
  }
  /* 刘海屏横屏时避开左右安全区，避免操作键/数值被挖孔遮挡 */
  body.phone-landscape #game-wrap {
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  /* 竖屏旋转铺满：物理竖屏下把整个游戏容器旋转 90°，横屏内容铺满屏幕（安卓/苹果一致） */
  body.force-landscape #game-wrap {
    position: fixed; top: 0; left: 0;
    width: 100vh; height: 100vw;
    transform-origin: left top;
    transform: rotate(90deg) translateY(-100vw);
    border-radius: 0; box-shadow: none;
  }
  body.force-landscape canvas#game { border-radius: 0; box-shadow: none; }
  @supports (height: 100dvh) {
    body.force-landscape #game-wrap { width: 100dvh; height: 100vw; transform: rotate(90deg) translateY(-100vw); }
  }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }

  /* ---------- 标题 ---------- */
  /* 标题：位于画面上方，不再挤占中央 */
  .menu-head { position: absolute; top: 7%; left: 0; right: 0; text-align: center; }
  .menu-mid { position: absolute; top: 54%; left: 0; right: 0; text-align: center; }
  #menu-tip {
    position: absolute; bottom: 4%; left: 0; right: 0; text-align: center;
    font-size: 0.9em; font-weight: 700; line-height: 1.75; color: #fff;
    text-shadow: 0 0.13em 0 #E8A100, 0 0.22em 0.4em rgba(0, 0, 0, .28);
  }
  #menu-tip b { color: #FFF3B0; }
  .rotate-hint { display: none; }
  /* 手机竖屏时画面偏扁，提示横屏 */
  @media (orientation: portrait) and (max-width: 700px) {
    .rotate-hint { display: inline; }
  }

  .title {
    font-size: 4.2em;
    font-weight: 900; letter-spacing: 0.08em; color: #FFD93D;
    text-shadow:
      -0.045em -0.045em 0 #E8A100, 0.045em -0.045em 0 #E8A100,
      -0.045em 0.045em 0 #E8A100, 0.045em 0.045em 0 #E8A100,
      -0.045em 0 0 #E8A100, 0.045em 0 0 #E8A100,
      0 -0.045em 0 #E8A100, 0 0.045em 0 #E8A100,
      0 0.14em 0 rgba(232, 161, 0, .28), 0 0.22em 0.4em rgba(0, 0, 0, .22);
    animation: floaty 2.6s ease-in-out infinite;
  }
  .subtitle {
    margin-top: 0.3em; font-size: 0.95em; font-weight: 800;
    letter-spacing: 0.55em; color: #fff;
    text-shadow: 0 0.12em 0 #E8A100, 0 0.25em 0.6em rgba(0, 0, 0, .2);
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* ---------- 面板 ---------- */
  .screen { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #screen-menu { display: block; }
  .panel {
    pointer-events: auto;
    background: rgba(255, 255, 255, .93);
    border: 0.22em solid #FFD93D; border-radius: 1.3em;
    padding: 1.1em 1.9em 1.3em; text-align: center;
    box-shadow: 0 1em 2.6em rgba(0, 0, 0, .22);
    animation: pop .28s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes pop {
    from { transform: scale(.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .panel h2 { color: #7A4A00; font-size: 1.7em; letter-spacing: 0.1em; margin-bottom: 0.4em; }
  .panel .tip { color: #8A6D3B; font-size: 0.85em; line-height: 1.7; margin: 0.5em 0 0.8em; }
  .panel .tip b { color: #E8862C; }

  .btn {
    pointer-events: auto;
    font-family: inherit; font-size: 1.1em; font-weight: 800; letter-spacing: 0.1em;
    color: #7A4A00; background: linear-gradient(180deg, #FFE066, #FFC93C);
    border: 0.16em solid #E8A100; border-radius: 999px;
    padding: 0.6em 2em; margin: 0.3em 0.35em 0; cursor: pointer;
    box-shadow: 0 0.28em 0 #D89000, 0 0.5em 0.9em rgba(0, 0, 0, .16);
    transition: transform .07s, box-shadow .07s;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: translateY(0.18em); box-shadow: 0 0.1em 0 #D89000, 0 0.2em 0.4em rgba(0, 0, 0, .16); }
  .btn.ghost {
    background: #fff; color: #A97B1F; border-color: #F0C97A;
    box-shadow: 0 0.22em 0 #EAD9B0;
  }
  .btn-small { font-size: 0.8em; padding: 0.45em 1.5em; margin-top: 0.7em; }
  .btn.locked { background: #EDE7D8; color: #A08C66; border-color: #D9CCAC; box-shadow: 0 0.22em 0 #D9CCAC; }

  /* ---------- HUD ---------- */
  #hud {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 0.7em 1em; font-weight: 800;
  }
  .hud-left { display: flex; gap: 0.5em; flex-wrap: wrap; }
  .hud-card {
    background: rgba(255, 255, 255, .82); border-radius: 0.8em;
    padding: 0.28em 0.8em; font-size: 0.92em; color: #5B4200;
    box-shadow: 0 0.2em 0.6em rgba(0, 0, 0, .12);
    display: flex; align-items: center; gap: 0.35em;
  }
  .hud-card b { color: #E8862C; font-size: 1.2em; min-width: 1.2em; text-align: right; }
  .hud-right { display: flex; gap: 0.5em; pointer-events: auto; }
  .icon-btn {
    width: 2.3em; height: 2.3em; border-radius: 0.7em; border: none; cursor: pointer;
    background: rgba(255, 255, 255, .82); font-size: 1.1em; line-height: 1;
    box-shadow: 0 0.2em 0.6em rgba(0, 0, 0, .12);
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { transform: scale(.92); }

  /* ---------- 结算 ---------- */
  .score-grid {
    display: flex; gap: 0.6em; justify-content: center; margin: 0.5em 0 0;
  }
  .score-cell {
    background: #FFF6DE; border: 0.12em dashed #F0C97A; border-radius: 0.85em;
    padding: 0.45em 0.9em; min-width: 5.6em;
  }
  .score-cell .num { font-size: 1.7em; font-weight: 900; color: #E8862C; }
  .score-cell .lab { font-size: 0.78em; color: #8A6D3B; margin-top: 0.1em; }
  #record-badge {
    display: inline-block; margin-top: 0.5em; padding: 0.22em 1em; border-radius: 999px;
    background: linear-gradient(90deg, #FF8C42, #FFC93C); color: #fff;
    font-weight: 800; font-size: 0.88em; letter-spacing: 0.12em;
    box-shadow: 0 0.25em 0.7em rgba(255, 140, 66, .4);
    animation: pop .3s cubic-bezier(.34, 1.56, .64, 1);
  }

  /* ---------- 触摸按键 ---------- */
  #touch-controls {
    position: absolute; left: 0; right: 0; bottom: 4%;
    display: none; justify-content: space-between; padding: 0 4%;
  }
  /* 虚拟按键只在游戏进行中显示，避免菜单/结算界面误触与遮挡 */
  body.touch.in-game #touch-controls { display: flex; }
  .vbtn {
    pointer-events: auto; width: 4.2em; height: 4.2em; border-radius: 50%;
    font-size: 1.25em; font-weight: 900; font-family: inherit; color: #7A4A00;
    background: rgba(255, 255, 255, .55); border: 0.16em solid rgba(232, 161, 0, .75);
    box-shadow: 0 0.25em 0.8em rgba(0, 0, 0, .12);
  }
  .vbtn:active { background: rgba(255, 217, 61, .8); transform: scale(.94); }

  /* ---------- 手机端 UI 放大 ---------- */
  /* 触摸设备上统一放大按钮、HUD 与提示，保证看得清、点得准（触控目标约 44px 以上） */
  @media (pointer: coarse) {
    .btn { font-size: 1.3em; padding: 0.75em 2.1em; }
    .btn-small { font-size: 1.05em; padding: 0.6em 1.7em; }
    .icon-btn { width: 3.4em; height: 3.4em; font-size: 1.2em; }
    .hud-card { font-size: 1.1em; padding: 0.35em 0.95em; }
    #menu-tip { font-size: 1.15em; line-height: 1.8; }
    .vbtn { width: 5em; height: 5em; font-size: 1.55em; }
  }

  /* ---------- 竖屏旋转提示 ---------- */
  /* 画面比例为 2.4:1，竖屏下高度被宽度卡死会很扁，因此默认进入横屏游玩 */
  /* 手机竖屏时显示“进入横屏”入口：优先真实横屏（安卓/苹果均可停留），
     若设备/浏览器锁定竖屏，则自动旋转画面铺满，保证默认就是横屏体验 */
  .rotate-overlay { display: none; background: rgba(10, 30, 50, .2); }
  @media (orientation: portrait) and (max-width: 820px) {
    .rotate-overlay { display: flex; }
  }
  /* 已进入横屏（真实横屏或强制旋转）后不再显示提示 */
  body.force-landscape .rotate-overlay { display: none !important; }
  .rotate-icon { font-size: 3.2em; line-height: 1; animation: tilt 1.8s ease-in-out infinite; }
  @keyframes tilt {
    0%, 55% { transform: rotate(0deg); }
    75%, 100% { transform: rotate(-90deg); }
  }
  /* 全屏按钮：手机端右上角常驻，便于一键进入沉浸模式 */
  #btn-fullscreen {
    position: absolute; top: 0.7em; right: 0.9em; z-index: 30;
    width: 2.3em; height: 2.3em; border-radius: 0.7em; border: none; cursor: pointer;
    background: rgba(255, 255, 255, .82); font-size: 1.1em; line-height: 1;
    box-shadow: 0 0.2em 0.6em rgba(0, 0, 0, .12);
    display: none; align-items: center; justify-content: center;
  }
  body.touch #btn-fullscreen { display: flex; }
  #btn-fullscreen:active { transform: scale(.92); }
</style>
</head>

<script data-page-node-id="kf5D4MTMpWbbo1ZeVkknAi" data-pnid-children="LRw54GQi0Ijmu1TfoNpjGB">
(function () {
  'use strict';

  /* ================= 基础 ================= */

  /* ================= 存档 ================= */
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },

  };

  var muted = store.get('nailoong_mute', '0') === '1';

  /* ================= 音效（Web Audio 合成） ================= */
  var SFX = {
    ctx: null,
    // 音频初始化失败绝不阻断游戏
    ensure: function () {
      try {
        if (!this.ctx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          var p = this.ctx.resume();
          if (p && p.catch) p.catch(function () {});
        }
      } catch (e) { this.ctx = null; }
    },
    tone: function (f0, f1, dur, type, vol, delay) {
      if (muted || !this.ctx) return;
      try {
      var t = this.ctx.currentTime + (delay || 0);
      var o = this.ctx.createOscillator();
      var g = this.ctx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f0, t);
      if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
      g.gain.setValueAtTime(vol || 0.1, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    },
    noise: function (dur, vol, delay) {
      if (muted || !this.ctx) return;
      try {
      var t = this.ctx.currentTime + (delay || 0);
      var len = Math.floor(this.ctx.sampleRate * dur);
      var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = this.ctx.createBufferSource();
      src.buffer = buf;
      var f = this.ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 900;
      var g = this.ctx.createGain(); g.gain.value = vol || 0.2;
      src.connect(f); f.connect(g); g.connect(this.ctx.destination);
      src.start(t);
      } catch (e) {}
    },
    jump: function () { this.tone(260, 640, 0.16, 'square', 0.09); },
    land: function () { this.tone(180, 90, 0.07, 'sine', 0.06); },
    coin: function () { this.tone(988, 988, 0.06, 'square', 0.08); this.tone(1319, 1319, 0.14, 'square', 0.08, 0.06); },
    bossHit: function () { this.tone(210, 80, 0.12, 'sawtooth', 0.12); },
    bossSpawn: function () { this.tone(150, 320, 0.28, 'sawtooth', 0.1); this.tone(320, 150, 0.3, 'sawtooth', 0.1, 0.26); },
    bossCast: function () { this.tone(640, 980, 0.14, 'triangle', 0.08); this.tone(980, 640, 0.12, 'triangle', 0.08, 0.12); },
    bossFire: function () { this.tone(920, 260, 0.18, 'sawtooth', 0.11); this.noise(0.08, 0.08); },
    bossDash: function () { this.tone(300, 90, 0.22, 'sawtooth', 0.12); this.noise(0.16, 0.14); },
    bossPhase: function () { this.tone(180, 420, 0.3, 'triangle', 0.1); this.tone(420, 180, 0.34, 'triangle', 0.1, 0.16); },
    bossAwaken: function () {
      this.tone(110, 520, 0.7, 'sawtooth', 0.12);
      this.tone(220, 660, 0.55, 'triangle', 0.1, 0.1);
      this.tone(330, 880, 0.45, 'square', 0.06, 0.22);

    },
    hit: function () { this.noise(0.25, 0.25); this.tone(140, 50, 0.3, 'sawtooth', 0.12); },
    over: function () { this.tone(392, 392, 0.14, 'square', 0.09); this.tone(311, 311, 0.14, 'square', 0.09, 0.15); this.tone(233, 200, 0.3, 'square', 0.09, 0.3); },
    start: function () { this.tone(523, 523, 0.09, 'square', 0.08); this.tone(659, 659, 0.09, 'square', 0.08, 0.08); this.tone(784, 784, 0.16, 'square', 0.08, 0.16); },
    record: function () { this.tone(523, 523, 0.1, 'square', 0.09); this.tone(659, 659, 0.1, 'square', 0.09, 0.1); this.tone(784, 784, 0.1, 'square', 0.09, 0.2); this.tone(1047, 1047, 0.28, 'square', 0.09, 0.3); }
  };

  /* ================= 游戏状态 ================= */
  var state = 'menu'; // menu | playing | paused | over
  var speed = BASE_SPEED;
  var traveled = 0;
  var score = 0;
  var coinCount = 0;
  var newRecord = false;
  var shake = 0;
  var nextObstacleAt = 420;
  var nextCoinAt = 800;

  var player = {
    x: 130, y: GROUND_Y, vy: 0,
    onGround: true, ducking: false,
    dead: false, deadT: 0,
    runPhase: 0, blinkT: 2.5
  };

  var obstacles = [];   // {type,x,y(top),w,h}
  var coins = [];       // {x,y,t}
  var clouds = [];
  var particles = [];
  var floatTexts = [];  // 吃金币的 +10 等飘字

  /* ================= Boss 胡萝卜术 ================= */
  var BOSS_SCORE = 1000;  // 达到该分数后 Boss 现身
  // 四个阶段：每阶段都有独立血条，血量不同、血条长度也不同（越长越难缠）
  // 打空当前阶段血条才进入下一阶段；第四阶段召唤武魂真身「厌世胡萝卜 · 张田中」
  var BOSS_PHASES = [
    { name: '第一阶段 · 挽留', hp: 12, bar: 236 },
    { name: '第二阶段 · 悲鸣', hp: 14, bar: 300 },
    { name: '第三阶段 · 狂暴', hp: 16, bar: 364 },

  ];
  var BOSS_HP = (function () { var t = 0; for (var i = 0; i < BOSS_PHASES.length; i++) t += BOSS_PHASES[i].hp; return t; })();
  var boss = {
    active: false, done: false, hp: BOSS_HP, php: BOSS_PHASES[0].hp,
    x: 0, y: 0, t: 0, hitFlash: 0, dying: 0,
    // 动作组状态机
    state: 'idle', stateT: 0, stateDur: 1, phase: 0, skill: '',
    targetX: 0, baseY: 238, tilt: 0, ease: 2.4, dashFired: false,
    armF: 0.3, armB: 0.12, flash: 0, pending: [], say: '', sayT: 0, sayMax: 2.1, ponder: 0
  };
  var bossSpirit = { on: 0, t: 0 };   // 武魂真身：on=显现度 0~1，t=存在时长
  var bossShots = []; // Boss 召唤的弹幕：胡萝卜 / 暗影能量弹 / 低位横扫
  var bossDefeated = store.get('nailoong_boss_defeated', '0') === '1'; // 是否已解锁换装（持久）
  // 角色皮肤：nailoong(奶龙，默认) | carrot(胡萝卜术)
  var skin = store.get('nailoong_skin', 'nailoong');
  // 奶蛙形象已停用，做一次性迁移把老存档切回奶龙
  if (store.get('nailoong_skin_v8', '') !== '1') {
    skin = 'nailoong';
    store.set('nailoong_skin', skin);
    store.set('nailoong_skin_v8', '1');
  }
  if (['nailoong', 'carrot'].indexOf(skin) < 0) skin = 'nailoong';

  // 可用形象表：胡萝卜术需击败 Boss 后才加入切换循环
  var SKINS = [
    { id: 'nailoong', name: '奶龙', icon: '🐉' },
    { id: 'carrot', name: '胡萝卜术', icon: '🥕', needBoss: true }
  ];
  function unlockedSkins() {
    var list = [];
    for (var i = 0; i < SKINS.length; i++) {
      if (!SKINS[i].needBoss || bossDefeated) list.push(SKINS[i]);
    }
    return list;
  }
  function skinInfo(id) {
    for (var i = 0; i < SKINS.length; i++) { if (SKINS[i].id === id) return SKINS[i]; }
    return SKINS[0];
  }

  /* ================= DOM ================= */
  var el = function (id) { return document.getElementById(id); };
  var hud = el('hud'), scMenu = el('screen-menu'), scPause = el('screen-pause'), scOver = el('screen-over');
  var hudScore = el('hud-score'), hudCoins = el('hud-coins'), hudBest = el('hud-best');
  var btnMute = el('btn-mute'), btnPause = el('btn-pause');
  var btnSkin = el('btn-skin');
  var rotateOverlay = el('rotate-overlay');
  // 触摸设备标记：仅触摸设备显示跳/蹲虚拟键，UI 同步放大一档
  var isTouch = ('ontouchstart' in window || navigator.maxTouchPoints > 0);

  /* ================= 默认横屏（安卓 / 苹果适配） =================
     手机横屏体验最好，这里做三件事：
     1) 真机横屏（物理转向）→ 画布铺满屏幕（body.phone-landscape）；
     2) 设备/浏览器锁定竖屏时 → 把整个游戏容器旋转 90° 强制横屏铺满（body.force-landscape）；
     3) 提供全屏入口，配合 viewport-fit=cover 与安全区适配，兼容刘海屏与手势条。 */
  function isPhoneSize() {
    return Math.min(window.innerWidth, window.innerHeight) <= 820;
  }
  function isPortraitNow() {
    if (window.matchMedia) return window.matchMedia('(orientation: portrait)').matches;
    return window.innerHeight > window.innerWidth;
  }
  function applyOrientation() {
    var phone = isTouch && isPhoneSize();
    var portrait = isPortraitNow();
    document.body.classList.toggle('phone-landscape', phone && !portrait);
    // 竖屏时默认进入强制横屏，不再让用户自己转
    var forced = phone && portrait;
    document.body.classList.toggle('force-landscape', forced);
    // 进入强制横屏后隐藏提示层；回到竖屏提示态由媒体查询控制
    if (forced) show(rotateOverlay, false);
    fitLayout();
  }
  // 记录是否由本页触发了全屏，便于退出与还原
  var isFullscreen = false;
  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement ||
           document.msFullscreenElement || null;
  }
  function enterFullscreen() {
    var node = document.documentElement;
    var req = node.requestFullscreen || node.webkitRequestFullscreen || node.msRequestFullscreen;
    if (!req) return; // 部分 iOS Safari 版本不支持网页全屏，静默跳过
    try {
      var p = req.call(node, { navigationUI: 'hide' });
      if (p && p.then) { p.then(function () { isFullscreen = true; }).catch(function () {}); }
      else { isFullscreen = true; }
    } catch (e) {}
  }
  function toggleFullscreen() {
    if (fsElement()) {
      var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (exit) { try { exit.call(document); } catch (e) {} }
    } else {
      enterFullscreen();
    }
    var b = el('btn-fullscreen');
    if (b) b.textContent = fsElement() ? '⤡' : '⛶';
  }

  function show(node, on) { node.classList.toggle('hidden', !on); }
  function fmt(n) { return String(n); }

  function refreshBestUI() {
    hudBest.textContent = fmt(bestScore);
    el('menu-best').textContent = fmt(bestScore);
    el('over-best').textContent = fmt(bestScore);
  }
  refreshBestUI();
  refreshSkinButton();
  btnMute.textContent = muted ? '🔇' : '🔊';

  /* ================= 工具 ================= */
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function ellipse(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2);
  }
  function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  /* ================= 背景 ================= */
  function initClouds() {
    clouds = [];
    for (var i = 0; i < 5; i++) {
      clouds.push({ x: rand(0, W), y: rand(30, 150), s: rand(0.6, 1.3), v: rand(14, 30) });
    }
  }
  initClouds();

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    g.addColorStop(0, '#3F9BDC');
    g.addColorStop(0.5, '#7FC8EF');
    g.addColorStop(0.85, '#C4E8F9');
    g.addColorStop(1, '#E8F6FD');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GROUND_Y);
    // 地平线薄雾（空气透视感）
    var hz = ctx.createLinearGradient(0, GROUND_Y - 60, 0, GROUND_Y);
    hz.addColorStop(0, 'rgba(255, 255, 255, 0)');
    hz.addColorStop(1, 'rgba(255, 250, 230, 0.35)');
    ctx.fillStyle = hz;
    ctx.fillRect(0, GROUND_Y - 60, W, 60);
    // 太阳：径向光晕 + 光芒
    ctx.save();
    var sg = ctx.createRadialGradient(838, 66, 8, 838, 66, 90);
    sg.addColorStop(0, 'rgba(255, 246, 190, 0.9)');
    sg.addColorStop(0.35, 'rgba(255, 240, 170, 0.4)');
    sg.addColorStop(1, 'rgba(255, 240, 170, 0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(838, 66, 90, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255, 242, 170, 0.5)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    for (var ri = 0; ri < 8; ri++) {
      var ra = ri * Math.PI / 4 + 0.4;
      ctx.beginPath();
      ctx.moveTo(838 + Math.cos(ra) * 40, 66 + Math.sin(ra) * 40);
      ctx.lineTo(838 + Math.cos(ra) * 52, 66 + Math.sin(ra) * 52);
      ctx.stroke();
    }
    var sd = ctx.createRadialGradient(830, 58, 4, 838, 66, 30);
    sd.addColorStop(0, '#FFFBE0');
    sd.addColorStop(0.7, '#FFEF9E');
    sd.addColorStop(1, '#F5D76E');
    ctx.fillStyle = sd;
    ctx.beginPath(); ctx.arc(838, 66, 30, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(230, 190, 90, 0.8)'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.restore();
  }

  function drawCloud(c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.s, c.s);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
    ctx.beginPath();
    ctx.arc(-24, 4, 15, 0, Math.PI * 2);
    ctx.arc(-4, -6, 20, 0, Math.PI * 2);
    ctx.arc(20, 2, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-26, 2, 50, 14);
    // 云底阴影（体积感）
    ctx.fillStyle = 'rgba(170, 195, 220, 0.35)';
    ctx.beginPath();
    ctx.ellipse(-2, 12, 30, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

      ctx.moveTo(x, yBase);
      ctx.quadraticCurveTo(x + step / 2, yBase - h, x + step, yBase);

      ctx.fill();

  }

  function drawGround() {

  /* ================= 奶龙（参考用户提供的形象绘制） ================= */
  // 柠檬黄头身一体的蛋形身体、浅米色圆肚、浅绿底大黑瞳、短横线微笑、
  // 深褐色三爪手脚。原点在脚底，整体高约 100
  function drawNailoong(now) {
    var p = player;
    var mode = p.dead ? 'dead' : (p.ducking ? 'duck' : (p.onGround ? 'run' : 'jump'));
    var ph = p.runPhase;
    var sw = Math.sin(ph);
    var sw2 = Math.sin(ph + Math.PI);

    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#000';
    var shScale = p.onGround ? 1 : clamp(1 - (GROUND_Y - p.y) / 150, 0.4, 1);
    ellipse(p.x, GROUND_Y + 4, 28 * shScale, 7 * shScale);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.dead) ctx.rotate(clamp(p.deadT * 5, 0, 1.35));
    if (mode === 'duck') ctx.scale(1.18, 0.62);
    if (mode === 'run') ctx.translate(0, -Math.abs(sw) * 2.5);
    if (mode === 'jump') ctx.rotate(0.05);

    var grad = ctx.createLinearGradient(-24, -100, 26, 0);
    grad.addColorStop(0, Y_L);
    grad.addColorStop(0.45, Y);
    grad.addColorStop(1, Y_D);

    /* ---- 腿脚：短粗，脚掌深褐色并带三个爪尖 ---- */
    function leg(fx, dy) {
      ctx.save();
      ctx.translate(fx, dy);
      ctx.fillStyle = Y_D;
      rr(-9.5, -26, 19, 26, 9);
      ctx.fill();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = LIMB;
      ctx.beginPath(); ctx.ellipse(0, -3, 12, 5.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = CLAW;
      [-6.5, 0, 6.5].forEach(function (dx) {
        ctx.beginPath(); ctx.ellipse(dx, -1.6, 2.3, 2.3, 0, 0, Math.PI * 2); ctx.fill();
      });
      ctx.restore();
    }
    var liftL = mode === 'run' ? Math.max(0, Math.sin(ph)) * 5 : (mode === 'jump' ? 4 : 0);
    var liftR = mode === 'run' ? Math.max(0, Math.sin(ph + Math.PI)) * 5 : (mode === 'jump' ? 2 : 0);
    leg(-13.5, -liftL);
    leg(13.5, -liftR);

    /* ---- 细短尾巴（摆动，垫在身体后） ---- */
    ctx.save();
    ctx.translate(-25, -20);
    ctx.rotate(-0.42 + (mode === 'run' ? Math.sin(ph) * 0.14 : 0));
    var tg = ctx.createLinearGradient(0, 0, -17, 2);
    tg.addColorStop(0, Y); tg.addColorStop(1, Y_D);
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.moveTo(1, -4.5);
    ctx.quadraticCurveTo(-11, -4, -16.5, 2.5);
    ctx.quadraticCurveTo(-10.5, 5.5, 1, 4.5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();

    /* ---- 身体 + 头：头身一体的蛋形 ---- */
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-27, -8);
    ctx.quadraticCurveTo(-34, -26, -32, -44);
    ctx.quadraticCurveTo(-30.5, -62, -26, -76);
    ctx.quadraticCurveTo(-23.5, -100, 0, -100);
    ctx.quadraticCurveTo(23.5, -100, 26, -76);
    ctx.quadraticCurveTo(30.5, -62, 32, -44);
    ctx.quadraticCurveTo(34, -26, 27, -8);
    ctx.quadraticCurveTo(0, -1.5, -27, -8);
    ctx.closePath();
    ctx.fill();
    // 体积光：左上当高光 + 右下柔和阴影（写实立体感）
    ctx.save();
    ctx.clip();
    var hl = ctx.createRadialGradient(-11, -84, 4, -11, -84, 46);
    hl.addColorStop(0, 'rgba(255, 250, 214, .5)');
    hl.addColorStop(1, 'rgba(255, 250, 214, 0)');
    ctx.fillStyle = hl; ctx.fillRect(-40, -110, 84, 116);
    var bsh = ctx.createRadialGradient(17, -20, 6, 17, -20, 48);
    bsh.addColorStop(0, 'rgba(160, 110, 20, .16)');
    bsh.addColorStop(1, 'rgba(160, 110, 20, 0)');
    ctx.fillStyle = bsh; ctx.fillRect(-40, -110, 84, 116);
    ctx.restore();
    ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.stroke();

    [-1, 1].forEach(function (s) {
      ctx.save();
      ctx.translate(9.5 * s, -97.5);
      ctx.rotate(0.16 * s);

      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = 'rgba(255, 255, 255, .38)';
      ctx.beginPath(); ctx.ellipse(-1.4, -7.2, 1.3, 2.2, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });

    /* ---- 肚皮：浅米色圆肚 + 弧形腹纹 ---- */
    ctx.fillStyle = BELLY;
    ctx.beginPath(); ctx.ellipse(0, -33, 21, 19.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = BELLY_E; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = BELLY_E; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-13, -30); ctx.quadraticCurveTo(0, -25, 13, -30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-11, -22.5); ctx.quadraticCurveTo(0, -18, 11, -22.5); ctx.stroke();

    /* ---- 手臂：短粗，末端深褐手掌带三爪 ---- */
    function arm(phase, front) {
      ctx.save();
      ctx.translate(front ? 26 : -26, -56);
      var ang;
      if (mode === 'dead') ang = front ? 0.4 : -0.4;
      else if (mode === 'jump') ang = front ? -0.7 : 0.7;
      else if (mode === 'duck') ang = front ? 0.9 : -0.9;
      else ang = -phase * 0.45;
      ctx.rotate(ang);
      ctx.fillStyle = front ? Y : Y_D;
      rr(-6.8, 0, 13.6, 20, 6.8); ctx.fill();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = LIMB;
      ctx.beginPath(); ctx.ellipse(0, 21, 6.5, 5.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = CLAW;
      [-4, 0, 4].forEach(function (dx) {
        ctx.beginPath(); ctx.ellipse(dx, 24, 2, 2, 0, 0, Math.PI * 2); ctx.fill();
      });

    arm(sw2, false);
    arm(sw, true);

    /* ---- 眼睛：大而黑亮（奶龙标志性圆眼） ---- */
    function eye(ex, ey) {
      if (p.dead) {
        ctx.strokeStyle = '#3A2B00'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(ex - 4, ey - 4); ctx.lineTo(ex + 4, ey + 4);
        ctx.moveTo(ex + 4, ey - 4); ctx.lineTo(ex - 4, ey + 4);
        ctx.stroke();

      }
      ctx.fillStyle = '#FFFDF2';
      ctx.beginPath(); ctx.ellipse(ex, ey, 9, 9.6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(120, 96, 40, .45)'; ctx.lineWidth = 2; ctx.stroke();
      if (blink) {
        ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(ex - 4.8, ey); ctx.lineTo(ex + 4.8, ey); ctx.stroke();
      } else {
        // 大黑瞳带双层高光
        var pg = ctx.createRadialGradient(ex - 1, ey - 2, 1, ex + 0.4, ey + 0.6, 7.6);
        pg.addColorStop(0, '#3A3A30');
        pg.addColorStop(0.5, '#161611');
        pg.addColorStop(1, '#050504');
        ctx.fillStyle = pg;
        ctx.beginPath(); ctx.arc(ex + 0.4, ey + 0.4, 7.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, .92)';
        ctx.beginPath(); ctx.arc(ex - 2.2, ey - 3, 2.1, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, .45)';
        ctx.beginPath(); ctx.arc(ex + 3, ey + 3, 1.1, 0, Math.PI * 2); ctx.fill();

    eye(-11, -78);
    eye(11, -78);

    /* ---- 腮红（奶萌感） ---- */
    ctx.fillStyle = 'rgba(255, 150, 90, .16)';
    ctx.beginPath(); ctx.ellipse(-17, -66, 4.6, 2.9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(17, -66, 4.6, 2.9, 0, 0, Math.PI * 2); ctx.fill();

    /* ---- 嘴：短横线微笑 ---- */
    ctx.strokeStyle = '#7A5A2A'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    if (p.dead) {
      ctx.fillStyle = '#8A4A46';
      ctx.beginPath(); ctx.ellipse(0, -58.5, 5.5, 6.5, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(-7.5, -60);
      ctx.quadraticCurveTo(0, -57, 7.5, -60);
      ctx.stroke();
    }

    ctx.restore();
  }

  /* ================= 胡萝卜术（按片人设：黑碎发眼镜男） ================= */
  // 蓬松黑色碎发、黑框眼镜、黑色 V 领毛衣内搭浅蓝条纹衬衫（领口与袖口露出条纹）、
  // 深灰长裤、白袜黑皮鞋。非 Q 版比例（约 5 头身）。
  // 原点在脚底，整体高约 108；swing 用于跑步摆臂/迈腿。
  // opts.pose: 'run'(主角站立/跑动) | 'float'(Boss 漂浮翘腿坐姿)

    var pose = opts.pose || 'run';
    var floating = (pose === 'float');

    /* ---------------- 调色板 ---------------- */
    var SKIN_H = '#F9EFE6', SKIN = '#F0E2D6', SKIN_M = '#D9C0B2';

    var SHT = '#B9D4E8', SHT_L = '#D6E7F4', SHT_D = '#8FB2CF';

    ctx.quadraticCurveTo(9, -85.8, 11.2, -83.4);
    ctx.bezierCurveTo(13, -86, 13.6, -90.5, 12.2, -96);
    ctx.bezierCurveTo(12.2, -104, 8, -110.5, 0, -110.5);
    ctx.bezierCurveTo(-8, -110.5, -12.2, -104, -12.2, -96);
    ctx.closePath();
    ctx.fillStyle = grad(-12, -108, 12, -84, [[0, '#2B251E'], [0.4, HAIR], [1, HAIR_D]]);
    ctx.fill();

    ctx.beginPath(); ctx.moveTo(-8.5, -104); ctx.quadraticCurveTo(-10.4, -95, -8.6, -87); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-3.5, -106.5); ctx.quadraticCurveTo(-5, -97, -3.4, -88); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3.5, -106.5); ctx.quadraticCurveTo(4.4, -97, 3.6, -88); ctx.stroke();

      ctx.bezierCurveTo(-9.2, 1.6, -8.4, 4.4, -6.2, 5.2);
      ctx.bezierCurveTo(-1, 6.8, 5.2, 6.2, 7.8, 4.4);
      ctx.bezierCurveTo(10, 2.8, 9.2, 0.2, 6.2, -0.6);

      ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';

      ctx.moveTo(-8.2, 3.8);

      ctx.quadraticCurveTo(12.6, -84.4, 13.4, -81);

  // 胡萝卜术皮肤的主角：与奶龙相同的影子/跳跃/下蹲/死亡表现
  function drawCarrotPlayer(now) {
    var p = player;
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#000';
    var shScale = p.onGround ? 1 : clamp(1 - (GROUND_Y - p.y) / 150, 0.4, 1);
    ellipse(p.x, GROUND_Y + 4, 27 * shScale, 7 * shScale);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.dead) ctx.rotate(clamp(p.deadT * 5, 0, 1.35));
    if (p.ducking) ctx.scale(1.18, 0.62);
    if (p.onGround && !p.ducking && !p.dead) ctx.translate(0, -Math.abs(Math.sin(p.runPhase)) * 3);
    drawCarrotMan(Math.sin(p.runPhase), { dead: p.dead, jump: !p.onGround && !p.dead });
    ctx.restore();
  }

  function drawPlayerChar(now) {
    if (skin === 'carrot') drawCarrotPlayer(now);
    else drawNailoong(now);
  }

  /* ---- Boss 战 ---- */
  // 三个阶段的气场配色：紫 → 紫红 → 血红
  var BOSS_AURA = [
    { fill: 'rgba(118,58,180,0.14)', ring: 'rgba(168,100,232,0.45)', glow: '#B46BE0', core: '#FFE9B8' },
    { fill: 'rgba(176,54,152,0.16)', ring: 'rgba(236,116,206,0.5)', glow: '#E86BC8', core: '#FFD6EC' },
    { fill: 'rgba(202,44,66,0.18)', ring: 'rgba(255,104,116,0.55)', glow: '#FF6B6B', core: '#FFD2B0' },
    { fill: 'rgba(226,124,32,0.20)', ring: 'rgba(255,186,80,0.62)', glow: '#FFB347', core: '#FFE0A8' }
  ];
  var BOSS_SKILL_NAME = {
    single: '召唤 · 胡萝卜', volley: '连发 · 骤雨', scatter: '散射 · 三连矢',
    orb: '追魂 · 暗影弹', charge: '俯冲 · 横扫'

  // Boss 台词气泡（原点已平移到 Boss 脚下，bx 一般为 0）
  function drawBossSpeech(text, bx, by, now, alpha) {
    ctx.save();
    ctx.font = '700 15px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var tw = ctx.measureText(text).width;
    var bw = tw + 26, bh = 30;
    // 开头 0.18s 弹入，结尾 0.45s 淡出
    var fi = clamp((boss.sayMax - boss.sayT) / 0.18, 0, 1);
    var fo = clamp(boss.sayT / 0.45, 0, 1);
    var a = Math.min(fi, fo) * alpha;
    if (a <= 0.02) { ctx.restore(); return; }
    var pop = (1 - fi) * 6;
    ctx.globalAlpha = a;
    ctx.translate(bx, by - pop);
    rr(-bw / 2, -bh, bw, bh, 11);
    ctx.fillStyle = 'rgba(252,248,240,0.94)'; ctx.fill();
    ctx.strokeStyle = 'rgba(90,70,50,0.55)'; ctx.lineWidth = 2; ctx.stroke();
    // 小尾巴
    ctx.beginPath();
    ctx.moveTo(-7, 0); ctx.lineTo(0, 9); ctx.lineTo(7, 0);
    ctx.closePath();
    ctx.fillStyle = 'rgba(252,248,240,0.94)'; ctx.fill();
    ctx.fillStyle = '#4A4038';
    ctx.fillText(text, 0, -bh / 2 + 1);
    ctx.restore();
  }

  function drawBoss(now) {
    var b = boss;
    var A = BOSS_AURA[b.phase] || BOSS_AURA[0];
    ctx.save();
    var alpha = 1, rot = 0;
    if (b.dying > 0) {
      var k = clamp(b.dying, 0, 1);
      alpha = 1 - k;
      rot = k * 2.2;
    }
    if (b.hitFlash > 0 && Math.floor(b.hitFlash * 40) % 2 === 0) alpha *= 0.45;
    ctx.globalAlpha = alpha;
    ctx.translate(b.x, b.y);
    if (rot) ctx.rotate(rot);

    // 第四阶段：武魂真身「厌世胡萝卜 · 张田中」立于身后
    if (bossSpirit.on > 0.01) drawSpirit(now, alpha);

    // 地面投影：浮得越高影子越小
    ctx.globalAlpha = alpha * 0.16;
    ctx.fillStyle = '#1A0C22';
    ellipse(0, GROUND_Y - b.y + 6, 48, 9); ctx.fill();
    ctx.globalAlpha = alpha;

    // 俯冲突进：身后拉出一串速度残影
    if (b.state === 'dash' && b.dying <= 0) {
      for (var di = 0; di < 7; di++) {
        var df = di / 7;
        var sx = 24 + df * 148 + Math.sin(now * 32 + di) * 7;
        var sy = -34 - Math.sin(now * 26 + di * 1.4) * 28 - df * 8;
        var lg = ctx.createLinearGradient(sx, sy, sx + 62, sy);
        lg.addColorStop(0, 'rgba(255,255,255,0)');
        lg.addColorStop(0.45, A.glow);
        lg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.globalAlpha = alpha * (0.36 * (1 - df) + 0.06);
        ctx.strokeStyle = lg; ctx.lineWidth = 4.5 - df * 2.8; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 60, sy); ctx.stroke();
      }
      ctx.globalAlpha = alpha;
    }

    // 阶段气场 + 三重符文环（越到后期转得越快）
    var ar = 86 + Math.sin(now * 3) * 6 + (b.phase >= 2 ? 7 : 0);
    ctx.fillStyle = A.fill;
    ctx.beginPath(); ctx.arc(0, -78, ar, 0, Math.PI * 2); ctx.fill();
    var spinA = now * (0.5 + b.phase * 0.6);
    for (var ri = 0; ri < 3; ri++) {
      var rad = ar + 5 + ri * 9;
      var seg = 0.46 + ri * 0.12;
      var dir = (ri % 2) ? -1 : 1;
      ctx.save();
      ctx.globalAlpha = alpha * (0.52 - ri * 0.13);
      ctx.strokeStyle = A.ring; ctx.lineWidth = 3 - ri * 0.6; ctx.lineCap = 'round';
      for (var si = 0; si < 3; si++) {
        var a0 = spinA * dir + si * 2.094;
        ctx.beginPath(); ctx.arc(0, -78, rad, a0, a0 + seg); ctx.stroke();
      }
      ctx.restore();
    }

    // 攻击预警：待发射的弹幕会在其弹道高度点亮一条闪烁警戒线，并从左边缘给出箭头
    if (b.pending.length > 0 && b.dying <= 0) {
      var pa = 0.5 + Math.sin(now * 20) * 0.35;
      var xEnd = Math.min(-316, 24 - b.x);
      ctx.save();
      ctx.lineCap = 'round';
      for (var pi2 = 0; pi2 < b.pending.length; pi2++) {
        var it2 = b.pending[pi2];
        var lcy = shotCy(it2.kind, it2.high) - b.y;
        var col = it2.kind === 'orb' ? 'rgba(122, 240, 174, 0.92)'
          : (it2.kind === 'sweep' ? 'rgba(186, 140, 250, 0.92)' : 'rgba(255, 168, 60, 0.92)');
        ctx.setLineDash([18, 13]);
        ctx.globalAlpha = alpha * pa * 0.85;
        ctx.strokeStyle = col; ctx.lineWidth = 4.5;
        ctx.beginPath(); ctx.moveTo(-56, lcy); ctx.lineTo(xEnd, lcy); ctx.stroke();
        ctx.setLineDash([]);
        // 左端箭头（指向玩家）
        ctx.globalAlpha = alpha * pa;
        ctx.lineWidth = 5;
        for (var ai = 0; ai < 2; ai++) {
          var ax = xEnd + 14 + ai * 22;
          ctx.beginPath();
          ctx.moveTo(ax + 12, lcy - 11); ctx.lineTo(ax, lcy); ctx.lineTo(ax + 12, lcy + 11);
          ctx.stroke();
        }
      }
      ctx.restore();
      ctx.globalAlpha = alpha;
    }

    // 躯干：整体轻微俯仰（聚气前倾 / 后仰叹息 / 受击踉跄）
    ctx.save();
    ctx.translate(0, -30); ctx.rotate(b.tilt); ctx.translate(0, 30);
    ctx.scale(1.6, 1.6);
    drawCarrotMan(Math.sin(now * 6) * 0.5, { pose: 'float', armF: b.armF, armB: b.armB });

    // 发射闪光：出手瞬间掌心炸开一团亮光
    if (b.flash > 0 && b.dying <= 0) {
      var fa = clamp(b.flash / 0.24, 0, 1);
      var fx0 = -14.4 - Math.sin(b.armB) * 24, fy0 = -82 + Math.cos(b.armB) * 24;
      var fr = 16 + (1 - fa) * 28;
      var fg0 = ctx.createRadialGradient(fx0, fy0, 1, fx0, fy0, fr);
      fg0.addColorStop(0, 'rgba(255, 255, 236, 0.95)');
      fg0.addColorStop(0.42, 'rgba(255, 186, 84, 0.8)');
      fg0.addColorStop(1, 'rgba(255, 140, 40, 0)');
      ctx.save();
      ctx.globalAlpha = alpha * fa;
      ctx.fillStyle = fg0;
      ctx.beginPath(); ctx.arc(fx0, fy0, fr, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // 掌心蓄力：聚气阶段在抬起的那只手上凝聚能量球，Tip 给玩家预判
    if ((b.state === 'wind' || b.state === 'fire') && b.dying <= 0) {
      var hx = -14.4 - Math.sin(b.armB) * 24;
      var hy = -82 + Math.cos(b.armB) * 24;
      var charged = b.state === 'wind' ? clamp(b.stateT / Math.max(0.01, b.stateDur), 0, 1) : 1;
      var pr = (6 + charged * 9) * (b.state === 'fire' ? 1.6 : 1);
      if (b.state === 'fire') pr *= 1 + (b.stateT / Math.max(0.01, b.stateDur)) * 0.6;
      var pg = ctx.createRadialGradient(hx, hy, 1, hx, hy, pr * 2.1);
      pg.addColorStop(0, 'rgba(255,255,255,0.95)');
      pg.addColorStop(0.4, A.glow);
      pg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = alpha * (0.6 + Math.sin(now * 26) * 0.18) * (0.5 + charged * 0.5);
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.arc(hx, hy, pr * 2.1, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = alpha * 0.85;
      // 锁定细环
      ctx.strokeStyle = A.core; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(hx, hy, pr + 5 + Math.sin(now * 20) * 2, 0, Math.PI * 2); ctx.stroke();
      // 倒数光环：收缩到掌心即出手
      if (b.state === 'wind') {
        var cr = 34 - charged * 20;
        ctx.globalAlpha = alpha * (0.3 + charged * 0.55);
        ctx.strokeStyle = A.core; ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.arc(hx, hy, cr, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = alpha;
    }
    ctx.restore();

    // 台词气泡（不随俯仰倾斜，保持水平可读）
    if (b.sayT > 0 && b.say && b.dying <= 0) {
      drawBossSpeech(b.say, 0, -196, now, alpha);
    }
    ctx.restore();
  }

  // Boss 血条：每个阶段一条独立血条，长度与血量各不相同（阶段越高越长）
  function drawBossBar() {
    var P = BOSS_PHASES[boss.phase] || BOSS_PHASES[0];
    var bw = P.bar, bh = 16, bx = (W - bw) / 2, by = 54;
    var ratio = clamp(boss.php / P.hp, 0, 1);
    var A = BOSS_AURA[boss.phase] || BOSS_AURA[0];
    ctx.save();
    if (boss.hitFlash > 0) ctx.translate(rand(-2, 2), 0);
    ctx.textAlign = 'center';
    ctx.font = '900 15px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(122, 40, 10, 0.9)';
    var label = 'BOSS 胡萝卜术 · ' + P.name + ' · 再收 ' + boss.php + ' 金币';
    ctx.strokeText(label, W / 2, by - 9);
    ctx.fillStyle = boss.phase >= 3 ? '#FFD9A0' : (boss.phase >= 2 ? '#FFD0D0' : '#FFE9B0');
    ctx.fillText(label, W / 2, by - 9);
    rr(bx, by, bw, bh, 8);
    ctx.fillStyle = 'rgba(20, 16, 8, 0.45)'; ctx.fill();
    if (ratio > 0) {
      var g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      g.addColorStop(0, boss.phase >= 3 ? '#FF8A3D' : '#FF5B4D');
      g.addColorStop(1, boss.phase >= 3 ? '#FFD166' : (boss.phase >= 2 ? '#FF3B5C' : '#FF9F43'));
      rr(bx + 2, by + 2, (bw - 4) * ratio, bh - 4, 6);
      ctx.fillStyle = g; ctx.fill();
    }
    // 阶段刻度：把本阶段血量均分成若干格（血量多时自动降低密度，避免过密）
    var step = P.hp > 12 ? Math.ceil(P.hp / 8) : 1;
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1;
    for (var si = step; si < P.hp; si += step) {
      var sx = bx + 2 + (bw - 4) * (si / P.hp);
      ctx.beginPath(); ctx.moveTo(sx, by + 3); ctx.lineTo(sx, by + bh - 3); ctx.stroke();
    }
    ctx.restore();
    rr(bx, by, bw, bh, 8);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)'; ctx.lineWidth = 2; ctx.stroke();
    // 出招提示：聚气/释放/突进时显示招式名，给玩家识别窗口
    if (boss.state === 'wind' || boss.state === 'fire' || boss.state === 'dash') {
      var nm = BOSS_SKILL_NAME[boss.skill];
      if (nm) {
        ctx.font = '800 13px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(40, 20, 60, 0.85)';
        ctx.strokeText(nm, W / 2, by + bh + 17);
        ctx.fillStyle = boss.state === 'wind' ? '#FFD9A0' : A.glow;
        ctx.fillText(nm, W / 2, by + bh + 17);
      }
    }
    ctx.restore();
  }

  // 弹幕轨道高度：生成与预警共用，保证预警线与实际弹道一致
  // 高位弹统一取 GROUND_Y-67：站立(头顶 -70)会被判定命中 15px，
  // 下蹲(头顶 -42)则留出约 13px 的可见空隙——肉眼能直接看出"蹲下过得去"
  function shotCy(kind, high) {
    if (kind === 'sweep') return GROUND_Y - 17;
    if (kind === 'orb') return GROUND_Y - 24; // 暗影弹恒为低位（必跳），语义更清晰
    return high ? GROUND_Y - 67 : GROUND_Y - 20;
  }
  // 碰撞盒：与绘制尺寸保持同步
  function shotBox(kind) {
    if (kind === 'sweep') return { w: 92, h: 28 };
    if (kind === 'orb') return { w: 32, h: 32 };
    return { w: 36, h: 22 };
  }

  // Boss 弹幕：carrot 胡萝卜 | orb 追魂暗影弹 | sweep 低位横扫
  function drawCarrotShot(s, now) {
    if (s.kind === 'orb') return drawOrbShot(s, now);
    if (s.kind === 'sweep') return drawSweepShot(s, now);
    ctx.save();
    ctx.translate(s.x, s.cy);
    ctx.rotate(Math.sin(now * 18 + s.spin) * 0.16); // 飞行摆动
    // 地面提示影：帮助玩家判断弹幕的水平位置与高度
    ctx.save();
    ctx.rotate(-Math.sin(now * 18 + s.spin) * 0.16);
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#3A1A08';
    ellipse(2, GROUND_Y - s.cy + 5, 20, 6); ctx.fill();
    ctx.restore();
    // 外发光（让弹幕在背景上更醒目）
    var hg = ctx.createRadialGradient(-2, 0, 2, -2, 0, 32);
    hg.addColorStop(0, 'rgba(255,178,74,0.40)');
    hg.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(-2, 0, 32, 0, Math.PI * 2); ctx.fill();
    // 尾迹
    var tg = ctx.createLinearGradient(8, 0, 62, 0);
    tg.addColorStop(0, 'rgba(255, 159, 67, 0.6)');
    tg.addColorStop(1, 'rgba(255, 159, 67, 0)');
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.moveTo(6, -9); ctx.lineTo(62, 0); ctx.lineTo(6, 9);
    ctx.closePath(); ctx.fill();
    // 胡萝卜身体（锥形，尖端朝左）
    var bg = ctx.createLinearGradient(-24, 0, 8, 0);
    bg.addColorStop(0, '#FFA24D'); bg.addColorStop(1, '#F0731F');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(-24, 0);
    ctx.quadraticCurveTo(-8, -11.5, 8, -8.5);
    ctx.quadraticCurveTo(12, 0, 8, 8.5);
    ctx.quadraticCurveTo(-8, 11.5, -24, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#C2560E'; ctx.lineWidth = 2.4; ctx.stroke();
    // 表面纹路
    ctx.strokeStyle = 'rgba(194, 86, 14, 0.75)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-11, -6); ctx.lineTo(-7, 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -7.5); ctx.lineTo(4, 7.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9, -6); ctx.lineTo(12, 4); ctx.stroke();
    // 绿叶
    ctx.fillStyle = '#4CAF50';
    ctx.save();
    ctx.translate(10, 0);
    ctx.rotate(Math.sin(now * 22 + s.spin) * 0.3);
    ellipse(7, -6, 10, 4.2); ctx.fill();
    ctx.rotate(0.5);
    ellipse(7, 3, 10, 4.2); ctx.fill();
    ctx.restore();
    // 高位弹：弹体下方显示下压箭头，提示"腾空会被追击，正解是下蹲"
    if (s.high) {
      ctx.save();
      ctx.globalAlpha = 0.42 + Math.sin(now * 14 + s.spin) * 0.18;
      ctx.fillStyle = '#FFD166';
      ctx.beginPath();
      ctx.moveTo(0, 14); ctx.lineTo(-6.5, 24); ctx.lineTo(6.5, 24);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  // 追魂暗影弹：绿色能量球，带拖尾与旋绕光环
  function drawOrbShot(s, now) {
    ctx.save();
    ctx.translate(s.x, s.cy);
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#0E3A22';
    ellipse(2, GROUND_Y - s.cy + 5, 18, 6); ctx.fill();
    ctx.restore();
    var tg = ctx.createLinearGradient(6, 0, 66, 0);
    tg.addColorStop(0, 'rgba(122, 240, 174, 0.6)');
    tg.addColorStop(1, 'rgba(122, 240, 174, 0)');
    ctx.fillStyle = tg;
    ellipse(30, 0, 36, 9); ctx.fill();
    var r = 15 + Math.sin(now * 12 + s.spin) * 1.6;
    var g = ctx.createRadialGradient(0, 0, 1, 0, 0, r * 2.2);
    g.addColorStop(0, 'rgba(240, 255, 246, 0.95)');
    g.addColorStop(0.38, 'rgba(122, 240, 174, 0.9)');
    g.addColorStop(1, 'rgba(40, 190, 110, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r * 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#EAFFF5';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.46, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.rotate(now * 5 + s.spin);
    ctx.strokeStyle = 'rgba(58, 208, 126, 0.9)'; ctx.lineWidth = 2.4;
    ellipse(0, 0, r * 1.55, r * 0.5); ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  // 低位横扫：贴地推进的紫色弧形刃
  function drawSweepShot(s, now) {
    ctx.save();
    ctx.translate(s.x, s.cy);
    var pulse = 0.75 + Math.sin(now * 22) * 0.25;
    // 地面提示影
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#2A1440';
    ellipse(2, GROUND_Y - s.cy + 5, 46, 7); ctx.fill();
    ctx.restore();
    // 拖影
    var tg = ctx.createLinearGradient(24, 0, 112, 0);
    tg.addColorStop(0, 'rgba(155, 107, 224, 0.5)');
    tg.addColorStop(1, 'rgba(155, 107, 224, 0)');
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.moveTo(22, -20); ctx.quadraticCurveTo(78, -2, 112, 10);
    ctx.lineTo(24, 10); ctx.closePath(); ctx.fill();
    // 外发光
    var eg = ctx.createRadialGradient(0, -4, 4, 0, -4, 62);
    eg.addColorStop(0, 'rgba(178,132,246,0.26)');
    eg.addColorStop(1, 'rgba(140,90,220,0)');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(0, -4, 62, 0, Math.PI * 2); ctx.fill();
    // 刃身
    var bg = ctx.createLinearGradient(-46, -20, 36, 15);
    bg.addColorStop(0, '#E4D3FF'); bg.addColorStop(0.5, '#9B6BE0'); bg.addColorStop(1, '#6D3FB8');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(-46, 3);
    ctx.quadraticCurveTo(-8, -24, 36, -16);
    ctx.quadraticCurveTo(42, 4, 32, 15);
    ctx.quadraticCurveTo(-5, 8, -46, 3);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(242, 234, 255, 0.92)'; ctx.lineWidth = 2; ctx.stroke();
    // 内弧高光
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(-30, 0); ctx.quadraticCurveTo(0, -14, 27, -11); ctx.stroke();
    // 擦地火花
    ctx.globalAlpha = pulse * 0.95;
    ctx.fillStyle = '#FFF0B8';
    for (var i = 0; i < 6; i++) {
      var fx = -36 + i * 15 + Math.sin(now * 30 + i * 2.1) * 5;
      var fy = 12 + Math.cos(now * 26 + i) * 4;
      ctx.beginPath(); ctx.arc(fx, fy, 2.6 - i * 0.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  /* ================= 武魂真身：厌世胡萝卜 · 张田中 ================= */
  // 原型取自暹罗厘普「四荤一素」里的胡萝卜张田中：橘黄色胡萝卜身、满脸皱纹、
  // 火柴棍一样的细胳膊细腿、蔫掉的胡萝卜缨，以及「四根线」组成的厌世脸
  // （两根外端下垂的短线眼 + 两段拼成倒扣弧的嘴）。原点在脚底，向上为负 y，高约 330。
  function drawZhangTianZhong(now, armLift, hot) {
    var OR_L = '#FFCE85', OR = '#FFB347', OR_M = '#F5871F';
    var LN = 'rgba(146,72,12,.6)';
    var WR = 'rgba(150,74,14,.40)';
    var GRN = '#5CBF52', GRN_D = '#3C8C39';
    var LIMB = '#3A2C1C';
    var lift = clamp(armLift || 0, 0, 1);
    var FY = -205; // 脸的中心高度
    var hands = {};

    ctx.save();
    var br = 1 + Math.sin(now * 1.5) * 0.015; // 呼吸起伏
    ctx.scale(br, br);

    /* ---- 火柴棍腿（细腿 + 小脚掌） ---- */
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = LIMB; ctx.lineWidth = 4.6;
    ctx.beginPath(); ctx.moveTo(-13, -68); ctx.quadraticCurveTo(-20, -38, -17, -8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(13, -68); ctx.quadraticCurveTo(20, -38, 17, -8); ctx.stroke();
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-25, -6); ctx.lineTo(-9, -6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9, -6); ctx.lineTo(25, -6); ctx.stroke();

    /* ---- 胡萝卜身体：上宽下尖 ---- */
    function bodyPath() {
      ctx.beginPath();
      ctx.moveTo(0, -42);
      ctx.bezierCurveTo(-8, -62, -20, -98, -30, -142);
      ctx.bezierCurveTo(-40, -186, -45, -224, -40, -246);
      ctx.bezierCurveTo(-36, -264, -20, -272, 0, -272);
      ctx.bezierCurveTo(20, -272, 36, -264, 40, -246);
      ctx.bezierCurveTo(45, -224, 40, -186, 30, -142);
      ctx.bezierCurveTo(20, -98, 8, -62, 0, -42);
      ctx.closePath();
    }
    bodyPath();
    var bg = ctx.createLinearGradient(-42, -250, 42, -70);
    bg.addColorStop(0, OR_L); bg.addColorStop(0.42, OR); bg.addColorStop(1, OR_M);
    ctx.fillStyle = bg; ctx.fill();
    ctx.save(); bodyPath(); ctx.clip();
    ctx.fillStyle = 'rgba(178,80,10,.18)';
    ctx.beginPath();
    ctx.moveTo(12, -272);
    ctx.bezierCurveTo(36, -264, 45, -224, 30, -142);
    ctx.bezierCurveTo(20, -98, 8, -62, 0, -42);
    ctx.lineTo(0, -272); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,240,200,.26)'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(-24, -234); ctx.bezierCurveTo(-31, -178, -22, -122, -11, -80); ctx.stroke();
    ctx.restore();
    bodyPath();
    ctx.strokeStyle = LN; ctx.lineWidth = 2.4; ctx.stroke();

    /* ---- 皱纹密布 ---- */
    ctx.strokeStyle = WR; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    var WRK = [
      [-20, -104, 22, -97], [-27, -136, 29, -128], [-33, -172, 35, -164],
      [-36, -248, 38, -241], [-29, -262, 31, -256]
    ];
    for (var wi = 0; wi < WRK.length; wi++) {
      var w = WRK[wi];
      ctx.beginPath();
      ctx.moveTo(w[0], w[1]);
      ctx.quadraticCurveTo((w[0] + w[2]) / 2, w[3] - 8, w[2], w[3]);
      ctx.stroke();
    }
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-6, -58); ctx.quadraticCurveTo(-14, -52, -19, -57); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -58); ctx.quadraticCurveTo(14, -52, 19, -57); ctx.stroke();

    /* ---- 四根线的厌世脸 ---- */
    ctx.strokeStyle = 'rgba(58,28,8,.88)'; ctx.lineWidth = 3.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-22, FY - 4); ctx.lineTo(-9, FY + 2); ctx.stroke();  // 左眼（外端下垂）
    ctx.beginPath(); ctx.moveTo(22, FY - 4); ctx.lineTo(9, FY + 2); ctx.stroke();    // 右眼
    ctx.lineWidth = 2.8;
    ctx.beginPath(); ctx.moveTo(-11, FY + 20); ctx.lineTo(0, FY + 15); ctx.stroke(); // 嘴（倒扣的弧）
    ctx.beginPath(); ctx.moveTo(0, FY + 15); ctx.lineTo(11, FY + 20); ctx.stroke();

    /* ---- 火柴棍手臂：随 Boss 出招抬起 ---- */
    function stickArm(s) {
      var a1 = 0.34 + lift * 2.5;                     // 0.34rad 垂手 → ≈2.84rad 高举
      var a2 = a1 + (lift > 0.5 ? 0.55 : -0.22);
      var l1 = 37, l2 = 31;
      var x0 = s * 34, y0 = -212;
      var x1 = x0 + s * Math.sin(a1) * l1, y1 = y0 + Math.cos(a1) * l1;
      var x2 = x1 + s * Math.sin(a2) * l2, y2 = y1 + Math.cos(a2) * l2;
      ctx.strokeStyle = LIMB; ctx.lineWidth = 4.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.lineWidth = 5.2;
      ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 + s * 3.6, y2 + 3.4); ctx.stroke();
      return { x: x2, y: y2 };
    }
    hands.hL = stickArm(-1);
    hands.hR = stickArm(1);

    // 出招时掌心凝聚橙色能量
    if (hot > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, hot) * (0.6 + Math.sin(now * 22) * 0.2);
      var hp = [hands.hL, hands.hR];
      for (var hi = 0; hi < hp.length; hi++) {
        var hg = ctx.createRadialGradient(hp[hi].x, hp[hi].y, 1, hp[hi].x, hp[hi].y, 20);
        hg.addColorStop(0, 'rgba(255,255,235,0.95)');
        hg.addColorStop(0.4, 'rgba(255,179,71,0.85)');
        hg.addColorStop(1, 'rgba(255,140,40,0)');
        ctx.fillStyle = hg;
        ctx.beginPath(); ctx.arc(hp[hi].x, hp[hi].y, 20, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    /* ---- 蔫掉的胡萝卜缨 ---- */
    function leaf(x0, y0, cx, cy, tx, ty, lw, col) {
      ctx.beginPath();
      ctx.moveTo(x0 - lw, y0);
      ctx.quadraticCurveTo(cx - lw * 1.5, cy, tx, ty);
      ctx.quadraticCurveTo(cx + lw * 1.5, cy, x0 + lw, y0);
      ctx.closePath();
      ctx.fillStyle = col; ctx.fill();
    }
    leaf(-15, -258, -37, -302, -50, -316, 8, GRN_D);
    leaf(15, -258, 37, -302, 50, -314, 8, GRN_D);
    leaf(0, -264, -3, -314, -6, -330, 9, GRN);

    ctx.restore();
    return hands;
  }

  // 武魂真身登场：巨大的厌世胡萝卜立在 Boss 身后，随 Boss 抬手同步举臂
  function drawSpirit(now, alpha) {
    var on = bossSpirit.on;
    var gy = GROUND_Y - boss.y;      // 地面（Boss 局部坐标）
    var sx = -46;
    ctx.save();
    ctx.globalAlpha = alpha * on;
    // 金色气场光晕
    var gg = ctx.createRadialGradient(sx, gy - 170, 20, sx, gy - 170, 215);
    gg.addColorStop(0, 'rgba(255,198,112,0.30)');
    gg.addColorStop(0.55, 'rgba(255,150,50,0.13)');
    gg.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(sx, gy - 170, 215, 0, Math.PI * 2); ctx.fill();
    // 召唤瞬间的冲击环
    if (bossSpirit.t < 1.2) {
      var kk = bossSpirit.t / 1.2;
      ctx.save();
      ctx.globalAlpha = alpha * (1 - kk) * 0.9;
      ctx.strokeStyle = 'rgba(255,216,110,0.95)'; ctx.lineWidth = 7 * (1 - kk) + 1.5;
      ctx.beginPath(); ctx.arc(sx, gy - 150, 30 + kk * 250, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    // 本体
    ctx.save();
    ctx.translate(sx, gy);
    ctx.rotate(-0.05);
    ctx.scale(0.95, 0.95);
    var lift = clamp((boss.armB - 0.12) / 1.15, 0, 1);
    var hot = (boss.state === 'wind' || boss.state === 'fire') ? 1 : 0;
    drawZhangTianZhong(now, lift, hot);
    ctx.restore();
    ctx.restore();
  }

  /* ================= Boss 动作组 ================= */
  // 状态流转：enter(入场) → idle(漂浮巡游/叹息) → wind(抬手聚气) → fire(挥手释放)
  //          → recover(垂首喘息)；另有 dash(俯冲突进横扫) 与 hurt(受击后仰)
  // 三个阶段（血量）逐步解锁招式：单次 → 连发/散射/追魂弹 → 追加俯冲横扫
  var BOSS_HOME = W - 170;
  var BOSS_LINES = {
    0: ['你也要走吗…', '别急，再陪我一会儿', '留下来好不好…'],
    1: ['为什么不回头看看…', '我说过的…', '别丢下我一个人'],
    2: ['那就别走了！', '全都别离开！', '为什么…为什么！'],
    3: ['那就…一起留在这吧', '累了吧，别跑了', '反正…都一样…']
  };
  var BOSS_HURT_LINES = ['呜…', '呃…', '啧…'];

  function bossPick(arr) { return arr[randInt(0, arr.length - 1)]; }
  function bossSay(text, dur) { boss.say = text; boss.sayT = dur || 2.1; boss.sayMax = boss.sayT; }
  function setBossState(s, dur) { boss.state = s; boss.stateT = 0; boss.stateDur = dur; }
  // 出手间隔：阶段越高越紧逼（整体较原版收紧约 1/3，避免 Boss 长时间发呆）
  function bossIdleDur() {
    if (boss.phase >= 3) return rand(0.38, 0.66);
    return boss.phase >= 2 ? rand(0.52, 0.86) : (boss.phase === 1 ? rand(0.74, 1.16) : rand(1.05, 1.55));
  }
  function bossSkillPool() {
    if (boss.phase >= 3) return ['volley', 'volley', 'scatter', 'orb', 'charge', 'charge'];
    if (boss.phase >= 2) return ['volley', 'scatter', 'orb', 'charge'];
    if (boss.phase === 1) return ['single', 'volley', 'scatter', 'orb'];
    return ['single', 'volley'];
  }
  function queuePending(delay, kind, high) { boss.pending.push({ t: delay, kind: kind, high: high }); }

  // 场上是否有正接近玩家的地面障碍（含排招到最后一发弹发射期间的移动余量）：
  // 有的话本轮流招只出高位弹（蹲即可躲），避免玩家被迫起跳躲避弹幕——
  // 起跳落点若与障碍到达时间重叠就是"躲弹必撞"的死角（发射清理只覆盖发射点左侧，
  // 右侧障碍比弹幕慢、跟着弹幕后面到，恰好撞上玩家落地时机）
  function groundObstacleNear() {
    if (!boss.active) return false;
    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i];
      if (o.type === 'bird_low' || o.type === 'bird_high') continue;
      if (o.x < W - 60) return true; // 4 连最后一发发射(约+1s)后仍会进入发射清理范围
    }
    return false;
  }

  // 招式编排：每式把若干发弹按节拍排进待发射队列（阶段越高弹数越多、节拍越密）
  function queueSkill(name) {
    boss.skill = name;
    var avoidLow = groundObstacleNear(); // 有地面障碍接近 → 本轮只出高位弹（蹲躲，落点无风险）
    if (avoidLow && (name === 'orb' || name === 'charge')) name = 'volley'; // 这两类必跳，换成可蹲的
    var high = avoidLow || Math.random() < 0.5;
    if (name === 'single') {
      queuePending(0, 'carrot', high);
      if (boss.phase >= 2) queuePending(0.34, 'carrot', high);
    } else if (name === 'volley') {
      var n = boss.phase >= 3 ? 4 : (boss.phase >= 2 ? 3 : 2);
      var gap = boss.phase >= 3 ? 0.24 : (boss.phase >= 2 ? 0.3 : 0.38);
      // 全同高度：高低交替 4 连在 0.24s 节拍下接近无解（滞空 h>65 的窗口仅约 0.45s，盖不住 0.72s 的到达跨度）
      for (var i = 0; i < n; i++) queuePending(i * gap, 'carrot', high);
    } else if (name === 'scatter') {
      // 高-低-高 0.34s 间隔可用"蹲→起跳→空中"化解；不再追加第 4 发（会落在玩家落地瞬间，无解）
      queuePending(0, 'carrot', true);
      queuePending(0.34, 'carrot', avoidLow);
      queuePending(0.68, 'carrot', true);
    } else if (name === 'orb') {
      queuePending(0, 'orb', false);
      if (boss.phase >= 2) queuePending(0.52, 'carrot', true);
      // 第 3 发留足落地后的反应时间再起跳（0.92s 会卡在落地瞬间）
      if (boss.phase >= 3) queuePending(1.25, 'orb', true);
    }
  }
  function bossNextAction() {
    var pool = bossSkillPool();
    var name = pool[randInt(0, pool.length - 1)];
    // 地面障碍接近玩家时避免横扫俯冲：横扫必须跳躲，落点会与障碍到达时间冲突
    if (name === 'charge' && groundObstacleNear()) name = 'volley';
    if (name === 'charge') {
      boss.skill = name;
      boss.pending.length = 0;
      queuePending(0.42, 'sweep', false); // 让横扫也走预警队列，提前点亮弹道
      setBossState('dash', 1.3);
      bossSay(bossPick(BOSS_LINES[boss.phase]), 1.5);
      SFX.bossDash();
    } else {
      queueSkill(name);
      setBossState('wind', boss.phase >= 2 ? 0.3 : 0.4);
      SFX.bossCast();
    }
  }

  // Boss 每帧动作：位置/倾角/手臂/浮动
  function updateBoss(dt) {
    boss.t += dt;
    boss.stateT += dt;
    boss.hitFlash = Math.max(0, boss.hitFlash - dt);
    boss.flash = Math.max(0, boss.flash - dt);
    if (boss.sayT > 0) boss.sayT -= dt;

    // 玩家阵亡 → Boss 收手
    if (player.dead) {
      boss.pending.length = 0;
      if (boss.state === 'wind' || boss.state === 'dash') setBossState('recover', 0.6);
    }

    // 武魂真身显现进度
    if (boss.phase >= 3) bossSpirit.t += dt;
    bossSpirit.on = boss.phase >= 3 ? Math.min(1, bossSpirit.on + dt * 1.5) : Math.max(0, bossSpirit.on - dt * 2);

    // 阶段推进：当前阶段血条打空才进入下一阶段（第四阶段召唤武魂真身）
    if (boss.php <= 0 && boss.phase < BOSS_PHASES.length - 1) {
      boss.phase++;
      boss.php = BOSS_PHASES[boss.phase].hp;
      boss.hp = bossTotalHp();
      shake = Math.max(shake, 10);
      SFX.bossPhase();
      boss.pending.length = 0;
      if (boss.phase === 1) {
        bossSay('别丢下我…', 2.2);
        floatTexts.push({ x: W / 2, y: 150, life: 1.6, big: true, text: '第二阶段 · 悲鸣', color: '#E9B8FF', stroke: '#5B2C86' });
      } else if (boss.phase === 2) {
        bossSay('那就别走了！', 2.4);
        floatTexts.push({ x: W / 2, y: 150, life: 1.6, big: true, text: '第三阶段 · 狂暴', color: '#FF9AA6', stroke: '#8A1424' });
      } else {
        bossSay('那就…一起留在这吧', 2.8);
        floatTexts.push({ x: W / 2, y: 150, life: 2, big: true, text: '武魂真身 · 厌世胡萝卜', color: '#FFD166', stroke: '#8A4A06' });
        shake = Math.max(shake, 18);
        bossSpirit.t = 0;
        SFX.bossAwaken();
        summonSpiritBurst();
      }
      setBossState('recover', 0.62);
    }

    // 待发射队列（支持连发/散射的节拍）
    for (var pi = boss.pending.length - 1; pi >= 0; pi--) {
      var it = boss.pending[pi];
      it.t -= dt;
      if (it.t <= 0) { fireBossShot(it.kind, it.high); boss.pending.splice(pi, 1); }
    }

    var tiltT = 0, armBT = 0.12, armFT = 0.3, easeT = 2.2, baseYT = 238;
    switch (boss.state) {
      case 'enter':
        boss.targetX = BOSS_HOME; easeT = 3.4; tiltT = -0.06;
        if (boss.stateT > 1 && (Math.abs(boss.x - BOSS_HOME) < 8 || boss.stateT > 2.5)) {
          setBossState('idle', bossIdleDur());
          bossSay(bossPick(BOSS_LINES[0]), 2.2);
        }
        break;
      case 'idle': // 漂浮巡游 + 呼吸发丝
        boss.targetX = BOSS_HOME + Math.sin(boss.t * 0.75) * 26 - (boss.phase >= 2 ? 14 : 0);
        tiltT = Math.sin(boss.t * 1.1) * 0.03;
        armBT = 0.12 + Math.sin(boss.t * 1.5) * 0.07;
        armFT = 0.3 + Math.sin(boss.t * 1.5 + 1) * 0.07;
        if (boss.stateT > boss.stateDur) bossNextAction();
        break;
      case 'wind': // 抬手聚气
        boss.targetX = BOSS_HOME - 26; easeT = 3.2; tiltT = 0.1;
        armBT = 1.2 + Math.sin(boss.stateT * 22) * 0.06;
        armFT = 0.55;
        if (boss.stateT > boss.stateDur) setBossState('fire', 0.22);
        break;
      case 'fire': // 挥手甩出
        tiltT = 0.2; armBT = 0.05; armFT = 0.78;
        if (boss.stateT > boss.stateDur) setBossState('recover', boss.phase >= 2 ? 0.34 : 0.5);
        break;
      case 'dash': // 俯冲突进 + 低位横扫
        boss.targetX = W - 268; easeT = 5.4; baseYT = 284; tiltT = 0.3;
        armBT = 0.95; armFT = 0.82;
        if (boss.stateT > boss.stateDur) setBossState('recover', 0.55);
        break;
      case 'recover': // 垂首喘息
        boss.targetX = BOSS_HOME + Math.sin(boss.t * 0.7) * 18; easeT = 2.8;
        tiltT = -0.06; armBT = 0.5; armFT = 0.55;
        if (boss.stateT > boss.stateDur) {
          // 连招：阶段越高越容易不回 idle 直接续手，压缩喘息窗口（阵亡/收手时不触发）
          var rush = boss.phase >= 3 ? 0.55 : (boss.phase === 2 ? 0.38 : (boss.phase === 1 ? 0.2 : 0));
          if (boss.active && !player.dead && Math.random() < rush) bossNextAction();
          else setBossState('idle', bossIdleDur());
        }
        break;
      case 'hurt': // 受击后仰，并打断剩余连招
        boss.targetX = Math.min(W - 80, BOSS_HOME + 34); easeT = 6;
        tiltT = -0.16; armBT = -0.1; armFT = 0.1;
        if (boss.stateT > boss.stateDur) setBossState('recover', 0.38);
        break;
    }

    var k = function (a, b, s) { return a + (b - a) * Math.min(1, s * dt); };
    boss.tilt = k(boss.tilt, tiltT, 8);
    boss.armB = k(boss.armB, armBT, 10);
    boss.armF = k(boss.armF, armFT, 10);
    boss.ease = k(boss.ease, easeT, 6);
    boss.baseY = k(boss.baseY, baseYT, 6);
    boss.x += (boss.targetX - boss.x) * Math.min(1, dt * boss.ease);
    boss.y = boss.baseY + Math.sin(boss.t * 2.2) * 14
      + (boss.state === 'hurt' ? Math.sin(boss.stateT * 58) * 3 : 0);
  }

  // 剩余总血量 = 本阶段剩余 + 之后所有阶段血量（用于判定击败）
  function bossTotalHp() {
    var t = Math.max(0, boss.php);
    for (var i = boss.phase + 1; i < BOSS_PHASES.length; i++) t += BOSS_PHASES[i].hp;
    return t;
  }

  // Boss 受击：扣本阶段血条；除闪白外，还会后仰退让并被打断连招
  function bossTakeHit() {
    boss.php--;
    boss.hp = bossTotalHp();
    boss.hitFlash = 0.18;
    boss.pending.length = 0;
    bossSay(bossPick(BOSS_HURT_LINES), 1.1);
    setBossState('hurt', 0.3);
  }

  // 武魂真身召唤：一圈金色冲击粒子
  function summonSpiritBurst() {
    for (var i = 0; i < 48; i++) {
      var a = (i / 48) * Math.PI * 2 + rand(-0.12, 0.12);
      var v = rand(120, 330);
      spawnParticle(boss.x - 46, boss.y - 130, {
        vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.72,
        grav: 60, life: rand(0.4, 0.9), size: rand(2.5, 5),
        color: ['#FFB347', '#FFD166', '#FF9F43', '#FFF3B0'][randInt(0, 3)]
      });
    }
  }

  // Boss 弹幕生成：carrot(胡萝卜) | orb(追魂暗影弹) | sweep(低位横扫)
  // 弹幕碾碎障碍：Boss 的攻击会打飞挡路的仙人掌/岩石（碎片飞溅），
  // 保证玩家"躲弹幕被迫起跳"后的落点干净——消除"躲弹必撞障碍"的落点死角
  function crushObstacle(idx) {
    var o = obstacles[idx];
    for (var i = 0; i < 9; i++) {
      spawnParticle(o.x, GROUND_Y - o.h * 0.55, {
        vx: rand(-190, 90), vy: rand(-260, -60),
        grav: 720, life: rand(0.3, 0.6), size: rand(2.5, 5.5),
        color: ['#3CB371', '#1E7A4C', '#9AA5B1', '#CDEAC0'][randInt(0, 3)]
      });
    }
    obstacles.splice(idx, 1);
  }

  function fireBossShot(kind, high) {
    kind = kind || 'carrot';
    var prog = clamp(1 - boss.hp / BOSS_HP, 0, 1); // 战况进度：越往后弹速越快（有上限）
    var v;
    if (kind === 'sweep') v = -(speed * 1.3 + 195 + prog * 190);
    else if (kind === 'orb') v = -(speed * 0.92 + 110 + prog * 150);
    else v = -(speed * 1.12 + 135 + prog * 165);
    if (boss.phase >= 3) v *= 1.08;
    var cy = shotCy(kind, high);
    bossShots.push({ x: boss.x - 34, cy: cy, vx: v, high: !!high, spin: rand(0, 6), kind: kind, t: 0 });
    boss.flash = 0.24;   // 发射闪光
    shake = Math.max(shake, kind === 'sweep' ? 9 : 4);

    var cols = kind === 'orb' ? ['#7BF0AE', '#3AD07E', '#E6FFF2']
      : kind === 'sweep' ? ['#9B6BE0', '#6D3FB8', '#E2CFFF']
        : ['#FF9F43', '#FFE066', '#FFF3B0'];
    for (var i = 0; i < (kind === 'carrot' ? 10 : 14); i++) {
      var a = rand(0, Math.PI * 2), vv = rand(40, 190);
      spawnParticle(boss.x - 34, boss.y - 96, {
        vx: Math.cos(a) * vv, vy: Math.sin(a) * vv,
        grav: 0, life: rand(0.22, 0.5), size: rand(2.5, 5.5), color: cols[randInt(0, 2)]
      });
    }
    if (kind === 'sweep') SFX.bossDash(); else SFX.bossFire();

    // 发射时清理发射点左侧的全部地面障碍（不限于本弹道带）：
    // 躲任意弹幕都可能用到跳跃（低位必跳、高位可跳可蹲），
    // 只要弹幕在飞，玩家的落点走廊就必须整体干净——彻底消除"躲弹落点撞障碍"。
    // 发射点右侧的障碍由 groundObstacleNear() 在出招选择时规避（见 queueSkill）。
    for (var ci = obstacles.length - 1; ci >= 0; ci--) {
      var co = obstacles[ci];
      if (co.type === 'bird_low' || co.type === 'bird_high') continue;
      if (co.x > boss.x - 34) continue; // 只清弹幕将飞过的发射点左侧
      crushObstacle(ci);
    }
  }

  /* ================= 障碍物 ================= */
  function drawCactus(x, y, w, h) {
    ctx.save();
    ctx.translate(x, y);
    // 主干
    ctx.fillStyle = '#3CB371';
    rr(-w / 2 + 8, -h, w - 16, h, 9);
    ctx.fill();
    ctx.strokeStyle = '#1E7A4C'; ctx.lineWidth = 2.5; ctx.stroke();
    // 左臂
    ctx.fillStyle = '#3CB371';
    rr(-w / 2 - 4, -h * 0.66, 13, 9, 4); ctx.fill(); ctx.stroke();
    rr(-w / 2 - 4, -h * 0.66 - 16, 9, 20, 4); ctx.fill(); ctx.stroke();
    // 右臂
    rr(w / 2 - 9, -h * 0.5, 13, 9, 4); ctx.fill(); ctx.stroke();
    rr(w / 2 + 0, -h * 0.5 - 14, 9, 18, 4); ctx.fill(); ctx.stroke();
    // 高光 + 刺
    ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
    rr(-w / 2 + 11, -h + 5, 5, h - 12, 2.5); ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)'; ctx.lineWidth = 1.5;
    for (var i = 0; i < 4; i++) {
      var sy = -h * 0.8 + i * h * 0.2;
      ctx.beginPath(); ctx.moveTo(2, sy); ctx.lineTo(7, sy - 3); ctx.stroke();
    }
    ctx.restore();
  }

  function drawRock(x, y, w, h) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#9AA5B1';
    ellipse(-6, -h * 0.45, w * 0.42, h * 0.55); ctx.fill();
    ellipse(7, -h * 0.35, w * 0.4, h * 0.5); ctx.fill();
    ctx.strokeStyle = '#6B7280'; ctx.lineWidth = 2.5;
    ellipse(-6, -h * 0.45, w * 0.42, h * 0.55); ctx.stroke();
    ellipse(7, -h * 0.35, w * 0.4, h * 0.5); ctx.stroke();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ellipse(-9, -h * 0.62, 5, 3.5); ctx.fill();
    ctx.restore();
  }

  function drawBird(x, y, t) {
    ctx.save();
    ctx.translate(x, y);
    var flap = Math.sin(t * 16);
    // 翅膀
    ctx.fillStyle = '#2D3748';
    ctx.save();
    ctx.rotate(flap * 0.8);
    ctx.beginPath();
    ctx.moveTo(-2, -3);
    ctx.quadraticCurveTo(-14, -14 - flap * 8, -24, -4 - flap * 6);
    ctx.quadraticCurveTo(-12, -2, -2, 0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // 身体
    ctx.fillStyle = '#4A5568';
    ellipse(0, 0, 17, 10);
    ctx.fill();
    ctx.strokeStyle = '#2D3748'; ctx.lineWidth = 2; ctx.stroke();
    // 尾羽
    ctx.beginPath();
    ctx.moveTo(-15, -2); ctx.lineTo(-26, -7); ctx.lineTo(-25, 3); ctx.closePath();
    ctx.fillStyle = '#2D3748'; ctx.fill();
    // 头
    ctx.fillStyle = '#4A5568';
    ctx.beginPath(); ctx.arc(13, -5, 8, 0, Math.PI * 2); ctx.fill();
    ctx.stroke();
    // 嘴
    ctx.fillStyle = '#FF9F43';
    ctx.beginPath(); ctx.moveTo(20, -6); ctx.lineTo(29, -3); ctx.lineTo(20, 0); ctx.closePath(); ctx.fill();
    // 眼
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(15, -7, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1A202C';
    ctx.beginPath(); ctx.arc(16, -7, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  /* ================= 金币 ================= */
  function drawCoin(c, t) {
    ctx.save();
    ctx.translate(c.x, c.y);
    var sq = Math.abs(Math.cos(t * 5 + c.t));
    ctx.scale(Math.max(0.18, sq), 1);
    ctx.fillStyle = '#FFD93D';
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#E8A100'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#F6B93B';
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
    // 星星
    ctx.fillStyle = '#FFF3B0';
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var r = i % 2 === 0 ? 4.5 : 2;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // 闪光
    if (Math.sin(t * 3 + c.t * 2) > 0.93) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.beginPath(); ctx.arc(c.x + 8, c.y - 9, 1.8, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* ================= 粒子 ================= */
  function spawnParticle(x, y, o) {
    particles.push({
      x: x, y: y,
      vx: o.vx || 0, vy: o.vy || 0,
      grav: o.grav || 0,
      life: o.life || 0.5, maxLife: o.life || 0.5,
      size: o.size || 4,
      color: o.color || '#FFD93D',
      shape: o.shape || 'dot'
    });
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += p.grav * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  function drawParticles() {
    particles.forEach(function (p) {
      var a = clamp(p.life / p.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      if (p.shape === 'line') {
        ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.size, p.y); ctx.stroke();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    });
  }

  /* ================= 生成 ================= */
  var OB_TYPES = ['cactus_s', 'cactus_l', 'rock', 'bird_low', 'bird_high'];

  function pickObstacle(hard) {
    var w = [
      ['cactus_s', 0.34],
      ['cactus_l', 0.20],
      ['rock', 0.10],
      ['bird_low', 0.16 + 0.06 * hard],
      ['bird_high', 0.14 + 0.10 * hard]
    ];
    var total = 0, i;
    for (i = 0; i < w.length; i++) total += w[i][1];
    var roll = Math.random() * total;
    for (i = 0; i < w.length; i++) {
      roll -= w[i][1];
      if (roll <= 0) return w[i][0];
    }
    return 'cactus_s';
  }

  // Boss 战专用障碍池：只出地面障碍——天空要留给玩家跳跃吃金币和躲弹幕
  function pickGroundObstacle() {
    var w = [['cactus_s', 0.5], ['cactus_l', 0.3], ['rock', 0.2]];
    var total = 0, i;
    for (i = 0; i < w.length; i++) total += w[i][1];
    var roll = Math.random() * total;
    for (i = 0; i < w.length; i++) {
      roll -= w[i][1];
      if (roll <= 0) return w[i][0];
    }
    return 'cactus_s';
  }

  function spawnObstacle(type) {
    var hard = clamp(traveled / 12000, 0, 1);
    var o = { type: type, x: W + 46 };
    if (type === 'cactus_s') { o.w = 30; o.h = 42; }
    else if (type === 'cactus_l') { o.w = 38; o.h = 64; }
    else if (type === 'rock') { o.w = 36; o.h = 26; }
    else if (type === 'bird_low') { o.w = 44; o.h = 28; o.cy = GROUND_Y - 32; }
    // 高空鸟：高度对准站立玩家头部（站立必被撞，下蹲可躲过）。
    // 原来的 -92 碰撞盒(214–238)整体高于站立玩家碰撞盒顶部(248)，不蹲也永远撞不到
    else { o.w = 44; o.h = 28; o.cy = GROUND_Y - 62; }
    obstacles.push(o);

    // 后期小仙人掌可能连排
    if (type === 'cactus_s' && Math.random() < hard * 0.55) {
      var extra = randInt(1, 2);
      for (var i = 0; i < extra; i++) {
        obstacles.push({ type: 'cactus_s', x: o.x + 30 * (i + 1), w: 30, h: 42 });
      }
    }
  }

  // 金币与障碍之间的最小水平间距：保证玩家收完金币有足够的落地/反应时间
  var COIN_SAFE_GAP = 180;

  // 生成点 sx 附近 gap 范围内是否已有金币（用于障碍生成时避让金币）
  function coinNearX(sx, gap) {
    for (var i = 0; i < coins.length; i++) {
      if (Math.abs(coins[i].x - sx) < gap) return true;
    }
    return false;
  }

  function spawnCoinGroup() {
    var n = randInt(3, 5);
    var gapX = 38;
    var startX = W + 40;
    var endX = startX + (n - 1) * gapX;
    // 与场上已有障碍保持安全间距：贴得太近就整组右移到该障碍之后，
    // 避免金币叠在障碍上或紧贴其后，出现"捡币必撞"的位置
    // 跑两轮：整组右移后可能与更靠右的障碍再次重叠（Boss 战障碍变多后概率上升）
    for (var pass = 0; pass < 2; pass++) {
      for (var k = 0; k < obstacles.length; k++) {
        var o = obstacles[k];
        var oL = o.x - o.w / 2, oR = o.x + o.w / 2;
        if (oR + COIN_SAFE_GAP > startX && oL - COIN_SAFE_GAP < endX) {
          startX = oR + COIN_SAFE_GAP;
          endX = startX + (n - 1) * gapX;
        }
      }
    }
    // Boss 战期间：金币排布更高更跳脱（多数要走位起跳去够），但不超过跳跃极限
    // （JUMP_V=820 / GRAVITY=2600 → 跳跃高度极限约 129px，封顶 116 留余量）
    var arc = Math.random() < (boss.active ? 0.75 : 0.45);
    var baseH = boss.active ? rand(30, 72) : rand(28, 52);
    var amp = boss.active ? rand(46, 72) : 46;
    var capH = boss.active ? 116 : 56;
    for (var i = 0; i < n; i++) {
      var h = baseH;
      if (arc && n > 1) h = baseH + Math.sin((i / (n - 1)) * Math.PI) * amp;
      h = Math.min(h, capH);
      coins.push({ x: startX + i * gapX, y: GROUND_Y - h, t: rand(0, 6) });
    }
  }

  /* ================= 流程控制 ================= */
  function startBoss() {
    boss.active = true;
    boss.hp = BOSS_HP;
    boss.x = W + 110;
    boss.y = 238;
    boss.t = 0;
    boss.hitFlash = 0;

    floatTexts.push({ x: W / 2, y: 158, life: 1.8, text: '收集金币攻击他，小心他的招式！', color: '#FFFFFF', stroke: '#4A6A00' });
  }

  function defeatBoss() {
    boss.active = false;
    boss.done = true;
    boss.dying = 0.001;
    boss.pending.length = 0; boss.sayT = 0; boss.say = '';
